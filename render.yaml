services:
  - type: web
    name: elimfilters-frontend
    runtime: static
    buildCommand: echo "pre-built static export"
    staticPublishPath: ./frontend/out
    pullRequestPreviewsEnabled: false
    routes:
      # Technology renames — HTTP 301 permanent redirects
      # Must precede catch-all rewrite or rewrite wins first
      - type: redirect
        source: /technologies/aquaguard
        destination: /technologies/hydrocore
        permanent: true
      - type: redirect
        source: /technologies/aquaguard/
        destination: /technologies/hydrocore/
        permanent: true
      - type: redirect
        source: /technologies/cooltech
        destination: /technologies/thermacore
        permanent: true
      - type: redirect
        source: /technologies/cooltech/
        destination: /technologies/thermacore/
        permanent: true
      # SPA catch-all — serves index.html for all unmatched routes
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400
