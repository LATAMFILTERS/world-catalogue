services:
  - type: web
    name: elimfilters-search-pro
    runtime: node
    plan: starter
    branch: claude/world-catalogue-build-thyf4l
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false
      - key: OUTLOOK_MAILBOX_EMAIL
        value: vabreu@elimfilters.com
      - key: OUTLOOK_SMTP_PASSWORD
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: KNOWLEDGE_CENTER_API_URL
        value: https://knowledge-center-api-staging.onrender.com
      - key: KNOWLEDGE_CENTER_API_KEY
        sync: false
      - key: KNOWLEDGE_ENGINE_RUNTIME_URL
        value: https://knowledge-engine-runtime-staging.onrender.com
      - key: ENGINE_API_KEY
        sync: false

  # Static frontend serving elimfilters.com. These redirects must execute at the
  # HTTP hosting layer, before Render attempts to resolve files in frontend/out.
  - type: web
    name: elimfilters-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    routes:
      - type: redirect
        source: /knowledge-system
        destination: /knowledge-center/
      - type: redirect
        source: /knowledge-system/contamination
        destination: /knowledge-center/engineering/
      - type: redirect
        source: /knowledge-system/contamination/particle-wear
        destination: /knowledge-center/engineering/contamination-control/
      - type: redirect
        source: /knowledge-system/contamination/diesel-water
        destination: /knowledge-center/engineering/fluid-cleanliness/
      - type: redirect
        source: /knowledge-system/contamination/hydraulic-system
        destination: /knowledge-center/engineering/contamination-control/
      - type: redirect
        source: /knowledge-system/standards
        destination: /knowledge-center/standards/
      - type: redirect
        source: /knowledge-system/standards/iso-16889
        destination: /knowledge-center/standards/iso-16889/
      - type: redirect
        source: /knowledge-system/standards/iso-4406
        destination: /knowledge-center/standards/iso-4406/
      - type: redirect
        source: /knowledge-system/standards/astm-d6304
        destination: /knowledge-center/standards/astm-d6304/
      - type: redirect
        source: /knowledge-system/standards/iso-12937
        destination: /knowledge-center/standards/iso-12937/
      - type: redirect
        source: /knowledge-system/standards/iso-5011
        destination: /knowledge-center/standards/iso-5011/
      - type: redirect
        source: /knowledge-system/standards/din-51524
        destination: /knowledge-center/standards/din-51524/
      - type: redirect
        source: /knowledge-system/standards/iso-16332
        destination: /knowledge-center/standards/iso-16332/
      - type: redirect
        source: /knowledge-system/standards/nfpa-t2-14
        destination: /knowledge-center/standards/nfpa-t2-14/
      - type: redirect
        source: /knowledge-system/standards/astm-d6210
        destination: /knowledge-center/standards/astm-d6210/
      - type: redirect
        source: /knowledge-system/standards/eu-dir-2019-130
        destination: /knowledge-center/standards/eu-dir-2019-130/
      - type: redirect
        source: /knowledge-system/standards/iso-11155
        destination: /knowledge-center/standards/iso-11155/
      - type: redirect
        source: /knowledge-system/standards/iso-8573-1
        destination: /knowledge-center/standards/iso-8573-1/
      - type: redirect
        source: /knowledge-system/standards/sae-j1539
        destination: /knowledge-center/standards/sae-j1539/
      - type: redirect
        source: /knowledge-center/engineering/operator-health
        destination: /knowledge-center/systems/cabin-air-protection/

  # Knowledge Center API — Candidate case intake and review workflow (Phase 2+ Staging)
  - type: web
    name: knowledge-center-api-staging
    runtime: node
    rootDir: services/knowledge-center-api
    plan: starter
    branch: claude/world-catalogue-build-thyf4l
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3002"
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge_center_staging
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: KNOWLEDGE_API_KEYS
        sync: false
      - key: KNOWLEDGE_REVIEW_MAILBOX
        value: support@elimfilters.com
      - key: REQUEST_BODY_LIMIT
        value: 1mb

  # Knowledge Engine Runtime — Reasoning service for knowledge-backed answers (Phase 2+ Staging)
  - type: web
    name: knowledge-engine-runtime-staging
    runtime: node
    rootDir: services/knowledge-engine-runtime
    plan: starter
    branch: claude/world-catalogue-build-thyf4l
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "8086"
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge_center_staging
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: ENGINE_API_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: MAX_RETRIEVAL_RECORDS
        value: "12"
      - key: MIN_ANSWER_CONFIDENCE
        value: "0.72"
      - key: MIN_PRODUCTION_CONFIDENCE
        value: "0.85"

  # Knowledge Channel Gateway — Multi-channel message orchestration (WhatsApp, Meta, Teams) (Phase 2+ Staging)
  - type: web
    name: knowledge-channel-gateway-staging
    runtime: node
    rootDir: services/knowledge-channel-gateway
    plan: starter
    branch: claude/world-catalogue-build-thyf4l
    buildCommand: npm ci && npm run build
    startCommand: node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3012"
      - key: DATABASE_URL
        fromDatabase:
          name: knowledge_center_staging
          property: connectionString
      - key: KNOWLEDGE_API_URL
        value: https://knowledge-center-api-staging.onrender.com
      - key: KNOWLEDGE_API_KEY
        sync: false
      - key: SYSTEM_ACTOR_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: WEB_CHAT_SHARED_SECRET
        sync: false
      - key: MICROSOFT_GRAPH_TENANT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_ID
        sync: false
      - key: MICROSOFT_GRAPH_CLIENT_SECRET
        sync: false
      - key: MICROSOFT_GRAPH_MAILBOX
        value: support@elimfilters.com

  # AI Assistant Services — WhatsApp, Instagram, LinkedIn & YouTube Bots
  - type: web
    name: elimfilters-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: DRY_RUN
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString

  - type: web
    name: elimfilters-instagram-bot
    runtime: node
    rootDir: elimfilters-instagram-bot
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: IG_ACCOUNT_ID
        value: "17841402919099745"
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: DRY_RUN
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString
      - key: IG_ACCESS_TOKEN
        sync: false
      - key: IG_APP_SECRET
        sync: false
      - key: IG_VERIFY_TOKEN
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false

  - type: web
    name: elimfilters-linkedin-bot
    runtime: node
    rootDir: elimfilters-linkedin-bot
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_ORGANIZATION_ID
        sync: false
      - key: LINKEDIN_VERIFY_TOKEN
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: DRY_RUN
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString
      - key: NVIDIA_NIM_API_KEY
        sync: false

  - type: web
    name: elimfilters-youtube-bot
    runtime: node
    rootDir: elimfilters-youtube-bot
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: YOUTUBE_CHANNEL_ID
        value: "UC_elimfilters_official"
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_VERIFY_TOKEN
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: DRY_RUN
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString
      - key: NVIDIA_NIM_API_KEY
        sync: false

  # Notification Worker — Processes queued notifications and delivers emails (Phase 2+ Staging)
  - type: background_worker
    name: notification-worker-staging
    runtime: node
    rootDir: services/notification-worker
    plan: starter
    branch: claude/world-catalogue-build-thyf4l
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: KNOWLEDGE_CENTER_API_URL
        value: https://knowledge-center-api-staging.onrender.com
      - key: KNOWLEDGE_CENTER_API_KEY
        sync: false
      - key: NOTIFICATION_WORKER_ACTOR_ID
        value: notification-worker-system
      - key: LOG_LEVEL
        value: info
      - key: AZURE_CLIENT_ID
        sync: false
      - key: AZURE_CLIENT_SECRET
        sync: false
      - key: AZURE_TENANT_ID
        sync: false

databases:
  - name: knowledge_center_staging
    plan: starter
  - name: elimfilters-instagram-db
    plan: free
