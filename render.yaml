# ELIMFILTERS World Catalogue - Render bridge only
# Lenovo/ELIMSERVER is the PRIMARY runtime and database owner.
# Cloudflare publishes the Lenovo services. Render owns no database,
# scheduler, Knowledge runtime, catalogue writer, or production secret.

services:
  - type: web
    name: elimfilters-search-pro
    runtime: node
    repo: https://github.com/LATAMFILTERS/world-catalogue
    branch: main
    plan: free
    buildCommand: node --version
    startCommand: node scripts/validate-hybrid-runtime.js && node scripts/render-bridge.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: ELIM_RUNTIME_NODE
        value: RENDER
      - key: ELIM_RUNTIME_ROLE
        value: STANDBY
      - key: ELIM_DOMAIN
        value: WORLD_CATALOGUE
      - key: ELIM_SCHEDULER_ENABLED
        value: "false"
      - key: BRIDGE_UPSTREAM_URL
        value: https://search-api.elimfilters.com
