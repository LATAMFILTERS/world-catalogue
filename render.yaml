services:
  - type: web
    name: world-catalogue
    runtime: node
    plan: free
    buildCommand: PUPPETEER_SKIP_DOWNLOAD=true npm install
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GODADDY_MAIL_PASS
        sync: false
