services:
  - type: web
    name: world-catalogue
    runtime: node
    plan: free
    buildCommand: npm install && node scripts/migrate-to-render.js && cd frontend && npm install && npm run build
    startCommand: node server.js
    healthCheckPath: /api/status
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: GODADDY_MAIL_PASS
        sync: false
