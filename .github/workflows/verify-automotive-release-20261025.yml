name: Verify Automotive Page Release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-automotive-release-20261025.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify automotive page scope and four R2 images
        shell: bash
        run: |
          set -euo pipefail
          base='https://pub-fee72f3f35274550bd8a47b181823e33.r2.dev/fleetguard/page-1/01-20'
          files=(
            'EA30755-MACROCORE-approved-opt.png'
            'EF38279-SYNTAPORE-approved-opt.png'
            'EL36889-SYNTRAX-approved-opt.png'
            'EC30729-MICROKAPPA-approved-opt.png'
          )
          for f in "${files[@]}"; do
            curl --fail --show-error --silent --location --max-time 25 "$base/$f" -o /tmp/automotive-product.png
            file --mime-type /tmp/automotive-product.png | grep -q 'image/png'
            test "$(stat -c%s /tmp/automotive-product.png)" -gt 1000
            echo "PASS_AUTO_IMAGE $f"
          done
          grep -q "maxWidth: '1560px'" frontend/src/components/AutomotiveIndustryPage.tsx
          grep -q 'automotive-hero-h264.mp4' frontend/src/components/AutomotiveIndustryPage.tsx
          grep -q "Automotive: 'Automotive'" frontend/src/components/PageHeader.tsx
          echo PASS_AUTOMOTIVE_SCOPED_LAYOUT
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify transcoded H264 and original video retained
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/public/images/Autos-Vin4.mp4
          test -s frontend/public/images/automotive-hero-h264.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 frontend/public/images/automotive-hero-h264.mp4 | tee /tmp/automotive-codec
          grep -qx 'codec_name=h264' /tmp/automotive-codec
          grep -qx 'pix_fmt=yuv420p' /tmp/automotive-codec
          echo PASS_AUTOMOTIVE_VIDEO
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify TypeScript
        working-directory: frontend
        run: npm run type-check
