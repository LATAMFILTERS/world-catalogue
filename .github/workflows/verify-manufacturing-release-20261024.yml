name: Manufacturing Release Verification
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-manufacturing-release-20261024.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify five manufacturing filter images
        shell: bash
        run: |
          set -euo pipefail
          base='https://pub-fee72f3f35274550bd8a47b181823e33.r2.dev/fleetguard/page-1/01-20'
          files=('EA11132-MACROCORE-approved-opt.png' 'EF90345-SYNTAPORE-approved-opt.png' 'EL84407-SYNTRAX-approved-opt.png' 'ES91108-HYDROCORE-approved-opt.png' 'EH65876-NANOFORCE-approved-opt.png')
          for f in "${files[@]}"; do
            curl --fail --silent --show-error --location --max-time 30 "$base/$f" -o /tmp/manufacturing-filter.png
            file --mime-type /tmp/manufacturing-filter.png | grep -q 'image/png'
            test "$(stat -c%s /tmp/manufacturing-filter.png)" -gt 1000
            echo "PASS_MANUFACTURING_IMAGE $f"
          done
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('frontend/src/components/IndustryFilterCarousel.tsx','utf8');
          const m=s.match(/const MANUFACTURING_KEYS: FamilyKey\[\] = \[([^\]]+)\]/);
          if(!m)throw Error('Manufacturing scope not specified');
          const families=[...m[1].matchAll(/'([^']+)'/g)].map(x=>x[1]);
          const expected=['primary-air','primary-fuel','oil-filters','fuel-water-separators','hydraulic-filters'];
          if(JSON.stringify(families)!==JSON.stringify(expected))throw Error('Wrong Manufacturing carousel families');
          const page=fs.readFileSync('frontend/src/components/ManufacturingIndustryPage.tsx','utf8');
          if(!page.includes('industryName="Manufacturing" lang={lang}'))throw Error('Missing carousel binding');
          if(!page.includes("maxWidth: '1560px'"))throw Error('Missing 1560px layout');
          console.log('PASS_MANUFACTURING_FIVE_FAMILIES');
          NODE
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Verify H264 hero and original preservation
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/public/images/Manufacture-1.mp4
          test -s frontend/public/images/manufacturing-hero-h264.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 frontend/public/images/manufacturing-hero-h264.mp4 | tee /tmp/manufacturing-codec
          grep -qx 'codec_name=h264' /tmp/manufacturing-codec
          grep -qx 'pix_fmt=yuv420p' /tmp/manufacturing-codec
          grep -q 'manufacturing-hero-h264.mp4' frontend/src/components/ManufacturingIndustryPage.tsx
          echo PASS_MANUFACTURING_H264
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run type-check
