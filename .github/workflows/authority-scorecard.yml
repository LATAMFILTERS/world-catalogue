name: Authority Scorecard

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - 'docs/seo-geo/**'
      - '.github/workflows/authority-scorecard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authority-scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and generate Authority Scorecard
        working-directory: frontend
        run: npm run build

      - name: Show Authority Scorecard summary
        run: cat reports/seo-geo/authority-scorecard.md

      - name: Upload Authority Scorecard
        uses: actions/upload-artifact@v4
        with:
          name: authority-scorecard
          path: |
            reports/seo-geo/authority-scorecard.json
            reports/seo-geo/authority-scorecard.md
          if-no-files-found: error
          retention-days: 30
