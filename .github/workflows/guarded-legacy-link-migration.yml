name: Complete verified legacy knowledge links

on:
  push:
    branches: [fix/complete-legacy-knowledge-links]
    paths:
      - '.github/legacy-link-trigger'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/complete-legacy-knowledge-links
          fetch-depth: 0

      - name: Replace only verified literal legacy links
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('frontend')
          redirects_file = root / 'public' / '_redirects'

          authorized = [
              root / 'src/components/Navigation.tsx',
              root / 'src/components/Footer.tsx',
              root / 'src/components/UniversalEndNavigation.tsx',
              root / 'src/components/TechDetailPage.tsx',
              root / 'src/components/StructuredStandardDefinition.tsx',
              root / 'src/components/StructuredSystemDefinition.tsx',
              root / 'src/components/StructuredFamilyDefinition.tsx',
              root / 'src/components/StructuredIndustryDefinition.tsx',
              root / 'src/components/StructuredTechnologyDefinition.tsx',
              root / 'src/app/page.tsx',
              root / 'src/app/search/page.tsx',
              root / 'src/app/about/page.tsx',
              root / 'src/app/knowledge-center/fleet-optimization/page.tsx',
              root / 'src/app/families/[slug]/page.tsx',
              root / 'src/lib/entity-graph.ts',
              root / 'src/lib/rich-results-schema.ts',
          ]

          redirect_rows = []
          for raw in redirects_file.read_text(encoding='utf-8').splitlines():
              line = raw.strip()
              if not line or line.startswith('#'):
                  continue
              parts = line.split()
              if len(parts) >= 3 and parts[0].startswith('/knowledge-system') and parts[2] == '301':
                  redirect_rows.append((parts[0], parts[1]))

          redirect_map = dict(redirect_rows)

          # Prefer the canonical trailing-slash destination whenever both forms exist.
          canonical = {}
          for source, destination in redirect_rows:
              key = source[:-1] if source.endswith('/') and source != '/' else source
              preferred = redirect_map.get(key + '/', destination)
              canonical[key] = preferred
              canonical[key + '/'] = preferred

          literal_pattern = re.compile(r"(?P<quote>['\"])(?P<url>/knowledge-system[^'\"]*)(?P=quote)")
          changed = []
          skipped = []

          for path in authorized:
              if not path.exists():
                  continue
              original = path.read_text(encoding='utf-8')

              def replace(match):
                  url = match.group('url')
                  quote = match.group('quote')
                  lowered = url.lower()
                  if '${' in url or '{' in url or '}' in url:
                      skipped.append((str(path), url, 'dynamic'))
                      return match.group(0)
                  if 'duratech' in lowered or 'marineclean' in lowered:
                      skipped.append((str(path), url, 'protected technology'))
                      return match.group(0)
                  destination = canonical.get(url)
                  if not destination:
                      skipped.append((str(path), url, 'no exact redirect'))
                      return match.group(0)
                  return f'{quote}{destination}{quote}'

              updated = literal_pattern.sub(replace, original)
              if updated != original:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))

          print('Changed authorized files:')
          for item in changed:
              print(f'  {item}')

          print('Skipped legacy references:')
          for item in sorted(set(skipped)):
              print(f'  {item[0]} :: {item[1]} :: {item[2]}')

          # Guardrails: no active legacy-tree source page may be modified.
          active_tree_changes = [
              line for line in __import__('subprocess').check_output(
                  ['git', 'diff', '--name-only'], text=True
              ).splitlines()
              if line.startswith('frontend/src/app/knowledge-system/')
          ]
          if active_tree_changes:
              raise SystemExit(f'Active legacy tree was modified: {active_tree_changes}')
          PY

      - name: Verify protected scope and remaining references
        shell: bash
        run: |
          echo '--- Authorized-file diff ---'
          git diff -- \
            frontend/src/components/Navigation.tsx \
            frontend/src/components/Footer.tsx \
            frontend/src/components/UniversalEndNavigation.tsx \
            frontend/src/components/TechDetailPage.tsx \
            frontend/src/components/StructuredStandardDefinition.tsx \
            frontend/src/components/StructuredSystemDefinition.tsx \
            frontend/src/components/StructuredFamilyDefinition.tsx \
            frontend/src/components/StructuredIndustryDefinition.tsx \
            frontend/src/components/StructuredTechnologyDefinition.tsx \
            frontend/src/app/page.tsx \
            frontend/src/app/search/page.tsx \
            frontend/src/app/about/page.tsx \
            frontend/src/app/knowledge-center/fleet-optimization/page.tsx \
            'frontend/src/app/families/[slug]/page.tsx' \
            frontend/src/lib/entity-graph.ts \
            frontend/src/lib/rich-results-schema.ts

          echo '--- Remaining /knowledge-system references under frontend/src ---'
          grep -R -n '/knowledge-system' frontend/src --exclude-dir=node_modules || true

          if git diff --name-only | grep -E '^frontend/src/app/knowledge-system/'; then
            echo 'ERROR: active legacy tree changed'
            exit 1
          fi

          if git diff | grep -Ei 'duratech|marineclean'; then
            echo 'ERROR: protected technology text changed'
            exit 1
          fi

      - name: Remove one-off automation and commit implementation
        shell: bash
        run: |
          rm -f .github/workflows/guarded-legacy-link-migration.yml
          rm -f .github/legacy-link-trigger

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A

          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi

          git commit -m 'fix(seo): complete verified legacy knowledge links'
          git push origin HEAD:fix/complete-legacy-knowledge-links
