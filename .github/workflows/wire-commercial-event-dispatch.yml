name: Wire commercial backend event dispatch
on:
  push:
    branches: [main]
    paths:
      - 'frontend/src/lib/commercial-intelligence.ts'
      - '.github/workflows/wire-commercial-event-dispatch.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch CommercialAnalytics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('frontend/src/components/CommercialAnalytics.tsx')
          t=p.read_text()
          imp="import { sendCommercialIntelligenceEvent } from '@/lib/commercial-intelligence';"
          if imp not in t:
              t=t.replace("import { trackEvent } from '@/lib/analytics';", "import { trackEvent } from '@/lib/analytics';\n"+imp)
          old="""  trackEvent(name, {\n    page_path: window.location.pathname,\n    page_location: window.location.href,\n    page_title: document.title,\n    ...readCampaign(),\n    ...params,\n  });\n}"""
          new="""  const enriched = {\n    page_path: window.location.pathname,\n    page_location: window.location.href,\n    page_title: document.title,\n    ...readCampaign(),\n    ...params,\n  };\n\n  trackEvent(name, enriched);\n  sendCommercialIntelligenceEvent(name, enriched);\n}"""
          if old in t:
              t=t.replace(old,new,1)
          elif 'sendCommercialIntelligenceEvent(name, enriched);' not in t:
              raise SystemExit('sendEvent marker not found')
          p.write_text(t)
          PY
      - name: Remove installer and commit
        run: |
          rm -f .github/workflows/wire-commercial-event-dispatch.yml
          git config user.name "ELIMFILTERS Automation"
          git config user.email "automation@elimfilters.com"
          git add frontend/src/components/CommercialAnalytics.tsx .github/workflows/wire-commercial-event-dispatch.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Send governed conversion events to backend"
          git push origin main
