name: Verify official Markdown negotiation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-markdown-worker-http.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect HTML and Markdown responses on isolated workers.dev
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,json
          root='https://elimfilters-markdown-agents.elimfilters-storage.workers.dev'
          paths=['/','/es/knowledge-center/','/pt/knowledge-center/']
          errors=[]
          for path in paths:
            for accept in ['text/html','text/markdown']:
              req=urllib.request.Request(root+path,headers={'Accept':accept,'User-Agent':'ELIMFILTERS-worker-live-check/1.0'})
              try:
                with urllib.request.urlopen(req,timeout=18) as r:
                  data=r.read(250000)
                  status=r.status
                  ct=r.headers.get('Content-Type','')
                  vary=r.headers.get('Vary','')
              except Exception as e:
                print(json.dumps({'path':path,'accept':accept,'error':str(e)}),flush=True)
                errors.append((path,accept,str(e)))
                continue
              html = data.lstrip().lower().startswith(b'<!doctype html') or b'<html' in data[:500].lower()
              markdown = b'# ' in data[:1000] or b'Source:' in data[:1000]
              valid=(status==200 and (('text/html' in ct and html) if accept=='text/html' else ('text/markdown' in ct and markdown and 'accept' in vary.lower())))
              row={'path':path,'accept':accept,'status':status,'content_type':ct,'vary':vary,'bytes':len(data),'valid':valid,'body_prefix':data[:110].decode('utf8','replace') if not valid else None}
              print(json.dumps(row,ensure_ascii=False),flush=True)
              if not valid:errors.append((path,accept,'invalid response'))
          if errors:
            print('RESULT: NO-GO',errors)
            raise SystemExit(1)
          print('RESULT: PASS')
          PY

      - name: Inspect official Knowledge Center negotiation
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          url='https://elimfilters.com/es/knowledge-center/'
          results=[]
          for accept in ('text/html','text/markdown'):
            request=urllib.request.Request(url,headers={'Accept':accept,'User-Agent':'ELIMFILTERS-markdown-official-verifier/1.0'})
            try:
              with urllib.request.urlopen(request,timeout=20) as response:
                body=response.read(180000)
                result={'accept':accept,'status':response.status,'content_type':response.headers.get('Content-Type'),'vary':response.headers.get('Vary'),'prefix':body[:100].decode('utf-8','replace')}
            except urllib.error.HTTPError as e:
              result={'accept':accept,'status':e.code,'content_type':e.headers.get('Content-Type'),'prefix':e.read(120).decode('utf-8','replace')}
            except Exception as e:
              result={'accept':accept,'error':str(e)}
            print(json.dumps(result,ensure_ascii=False),flush=True)
            results.append(result)
          html,markdown=results
          good=(html.get('status')==200 and 'text/html' in (html.get('content_type') or '') and markdown.get('status')==200 and 'text/markdown' in (markdown.get('content_type') or '') and 'Accept' in (markdown.get('vary') or ''))
          print('OFFICIAL RESULT:', 'PASS' if good else 'NO-GO',flush=True)
          if not good: raise SystemExit(1)
          PY
