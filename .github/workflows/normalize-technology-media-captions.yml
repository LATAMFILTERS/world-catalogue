name: Normalize technology media captions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalize-technology-media-captions.yml'

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Normalize captions
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          caption = 'Microscopic visualization of filtration media structure used for technical illustration.'
          files = [
              'frontend/src/components/MacrocoreStablePage.tsx',
              'frontend/src/components/SyntaporeStablePage.tsx',
              'frontend/src/components/SyntraxStablePage.tsx',
              'frontend/src/components/NanoforceStablePage.tsx',
              'frontend/src/components/MicrokappaStablePage.tsx',
              'frontend/src/components/HydrocoreStablePage.tsx',
          ]

          pattern = re.compile(r'<figcaption>[^<]*(?:laboratory micrograph|technical illustration)[^<]*</figcaption>', re.I)
          for file in files:
              p = Path(file)
              if not p.exists():
                  continue
              text = p.read_text()
              text2 = pattern.sub(f'<figcaption>{caption}</figcaption>', text)
              if text2 != text:
                  p.write_text(text2)
          PY
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo 'No caption changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/components/*StablePage.tsx
          git commit -m 'Standardize technology media captions'
          git push
