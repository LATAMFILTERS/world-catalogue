name: GSC Page Indexing Intake

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'seo-geo-audit-input/gsc/*.csv'
      - 'scripts/seo-geo-audit/triage_gsc_indexing_examples.py'
      - '.github/workflows/gsc-indexing-intake.yml'

permissions:
  contents: read

concurrency:
  group: gsc-page-indexing-intake
  cancel-in-progress: false

jobs:
  triage-and-research:
    runs-on: ubuntu-latest
    env:
      HERMES_COLLECTION_DRY_RUN: ${{ vars.HERMES_COLLECTION_DRY_RUN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Detect detailed GSC example exports
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DIR='seo-geo-audit-input/gsc'
          crawled="$(find "$INPUT_DIR" -maxdepth 1 -type f -iname '*.csv' | grep -Ei '/[^/]*(crawled|rastreada)[^/]*\.csv$' | head -n 1 || true)"
          discovered="$(find "$INPUT_DIR" -maxdepth 1 -type f -iname '*.csv' | grep -Ei '/[^/]*(discovered|descubierta)[^/]*\.csv$' | head -n 1 || true)"

          if [ -z "$crawled" ] && [ -z "$discovered" ]; then
            echo 'has_input=false' >> "$GITHUB_OUTPUT"
            echo 'No detailed GSC Page Indexing CSV exports found.'
            exit 0
          fi

          echo 'has_input=true' >> "$GITHUB_OUTPUT"
          echo "crawled=$crawled" >> "$GITHUB_OUTPUT"
          echo "discovered=$discovered" >> "$GITHUB_OUTPUT"
          echo "Crawled export: ${crawled:-not provided}"
          echo "Discovered export: ${discovered:-not provided}"

      - name: Audit current production state
        if: steps.inputs.outputs.has_input == 'true'
        run: python3 scripts/seo-geo-audit/audit.py --out-dir seo-geo-audit-out

      - name: Triage GSC URL examples against live audit
        if: steps.inputs.outputs.has_input == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(--audit seo-geo-audit-out/seo-geo-audit.csv --out-dir seo-geo-audit-out)
          if [ -n "${{ steps.inputs.outputs.crawled }}" ]; then
            args+=(--crawled "${{ steps.inputs.outputs.crawled }}")
          fi
          if [ -n "${{ steps.inputs.outputs.discovered }}" ]; then
            args+=(--discovered "${{ steps.inputs.outputs.discovered }}")
          fi
          python3 scripts/seo-geo-audit/triage_gsc_indexing_examples.py "${args[@]}"

      - name: Count semantic candidates
        id: semantic
        if: steps.inputs.outputs.has_input == 'true'
        shell: bash
        run: |
          file='seo-geo-audit-out/gsc-indexing-semantic-candidates.csv'
          if [ ! -f "$file" ]; then
            echo 'count=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          count=$(python3 - <<'PY'
          import csv
          from pathlib import Path
          p = Path('seo-geo-audit-out/gsc-indexing-semantic-candidates.csv')
          with p.open(newline='', encoding='utf-8-sig') as f:
              print(sum(1 for _ in csv.DictReader(f)))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Semantic candidates: $count"

      - name: Build governed HERMES requests from crawled-not-indexed candidates
        if: steps.inputs.outputs.has_input == 'true' && steps.semantic.outputs.count != '0'
        run: |
          python3 scripts/seo-geo-audit/build_hermes_knowledge_gaps.py \
            seo-geo-audit-out/gsc-indexing-semantic-candidates.csv \
            --out-dir seo-geo-audit-out/gsc-hermes

      - name: Import GSC semantic gaps as governed HERMES candidates
        if: steps.inputs.outputs.has_input == 'true' && steps.semantic.outputs.count != '0'
        run: node scripts/hermes/import-seo-knowledge-gaps.mjs seo-geo-audit-out/gsc-hermes/hermes-knowledge-gaps.json

      - name: Research GSC candidates with HERMES
        id: research
        if: steps.inputs.outputs.has_input == 'true' && steps.semantic.outputs.count != '0'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HERMES_GROQ_MODEL: ${{ vars.HERMES_GROQ_MODEL || 'groq/compound' }}
        run: npm run hermes:research

      - name: Validate governed HERMES candidates
        if: steps.inputs.outputs.has_input == 'true' && steps.semantic.outputs.count != '0'
        run: npm run hermes:validate:real

      - name: Write intake summary when no semantic expansion is required
        if: steps.inputs.outputs.has_input == 'true' && steps.semantic.outputs.count == '0'
        run: |
          printf '%s\n' \
            '# GSC indexing intake result' \
            '' \
            'No technically clean crawled-not-indexed editorial/entity URL required semantic HERMES review in this intake.' \
            '' \
            'See gsc-indexing-triage.csv for crawl, technical, canonical, noindex and purpose-driven classifications.' \
            > seo-geo-audit-out/gsc-hermes-result.md

      - name: Upload intake evidence and HERMES artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-indexing-intake-${{ github.run_number }}
          path: |
            seo-geo-audit-input/gsc
            seo-geo-audit-out
            hermes/real-candidates
            hermes/real-candidates-previews
            hermes/real-candidates-resolved
          if-no-files-found: warn
          retention-days: 90

      - name: Fail clearly when no detailed export was supplied
        if: steps.inputs.outputs.has_input == 'false'
        run: |
          echo 'No crawled/discovered detailed GSC CSV was found under seo-geo-audit-input/gsc/.'
          echo 'Add the detailed example export(s); the workflow will rerun automatically.'
          exit 1
