name: GSC Page Indexing Intake

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'seo-geo-audit-input/gsc/*.csv'
      - 'scripts/seo-geo-audit/triage_gsc_indexing_examples.py'
      - 'scripts/seo-geo-audit/triage_gsc_technical_examples.py'
      - '.github/workflows/gsc-indexing-intake.yml'

permissions:
  contents: read

concurrency:
  group: gsc-page-indexing-intake
  cancel-in-progress: false

jobs:
  triage-and-research:
    runs-on: ubuntu-latest
    env:
      HERMES_COLLECTION_DRY_RUN: ${{ vars.HERMES_COLLECTION_DRY_RUN || 'true' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Detect detailed GSC example exports
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          INPUT_DIR='seo-geo-audit-input/gsc'
          files="$(find "$INPUT_DIR" -maxdepth 1 -type f -iname '*.csv' || true)"
          detect() { printf '%s\n' "$files" | grep -Ei "$1" | head -n 1 || true; }

          crawled="$(detect '/[^/]*(crawled|rastreada)[^/]*\.csv$')"
          discovered="$(detect '/[^/]*(discovered|descubierta)[^/]*\.csv$')"
          not_found="$(detect '/[^/]*(404|not[-_ ]?found|no[-_ ]?encontrad)[^/]*\.csv$')"
          duplicate="$(detect '/[^/]*(duplicate|duplicad)[^/]*(canonical|can[oó]nic)[^/]*\.csv$')"
          robots="$(detect '/[^/]*(robots|bloquead)[^/]*\.csv$')"
          redirect_error="$(detect '/[^/]*(redirect|redirecci[oó]n)[^/]*(error|err)[^/]*\.csv$')"
          server_error="$(detect '/[^/]*(5xx|server[-_ ]?error|error[-_ ]?de[-_ ]?servidor)[^/]*\.csv$')"

          if [ -z "$crawled$discovered$not_found$duplicate$robots$redirect_error$server_error" ]; then
            echo 'has_input=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'has_input=true' >> "$GITHUB_OUTPUT"
          echo "has_semantic=$([ -n "$crawled$discovered" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "has_technical=$([ -n "$not_found$duplicate$robots$redirect_error$server_error" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "crawled=$crawled" >> "$GITHUB_OUTPUT"
          echo "discovered=$discovered" >> "$GITHUB_OUTPUT"
          echo "not_found=$not_found" >> "$GITHUB_OUTPUT"
          echo "duplicate=$duplicate" >> "$GITHUB_OUTPUT"
          echo "robots=$robots" >> "$GITHUB_OUTPUT"
          echo "redirect_error=$redirect_error" >> "$GITHUB_OUTPUT"
          echo "server_error=$server_error" >> "$GITHUB_OUTPUT"

      - name: Audit current production state
        if: steps.inputs.outputs.has_input == 'true'
        run: python3 scripts/seo-geo-audit/audit.py --out-dir seo-geo-audit-out

      - name: Triage crawled/discovered GSC examples
        if: steps.inputs.outputs.has_semantic == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(--audit seo-geo-audit-out/seo-geo-audit.csv --out-dir seo-geo-audit-out)
          [ -z "${{ steps.inputs.outputs.crawled }}" ] || args+=(--crawled "${{ steps.inputs.outputs.crawled }}")
          [ -z "${{ steps.inputs.outputs.discovered }}" ] || args+=(--discovered "${{ steps.inputs.outputs.discovered }}")
          python3 scripts/seo-geo-audit/triage_gsc_indexing_examples.py "${args[@]}"

      - name: Triage technical GSC examples
        if: steps.inputs.outputs.has_technical == 'true'
        shell: bash
        run: |
          set -euo pipefail
          args=(--audit seo-geo-audit-out/seo-geo-audit.csv --out-dir seo-geo-audit-out)
          [ -z "${{ steps.inputs.outputs.not_found }}" ] || args+=(--not-found "${{ steps.inputs.outputs.not_found }}")
          [ -z "${{ steps.inputs.outputs.duplicate }}" ] || args+=(--duplicate "${{ steps.inputs.outputs.duplicate }}")
          [ -z "${{ steps.inputs.outputs.robots }}" ] || args+=(--robots "${{ steps.inputs.outputs.robots }}")
          [ -z "${{ steps.inputs.outputs.redirect_error }}" ] || args+=(--redirect-error "${{ steps.inputs.outputs.redirect_error }}")
          [ -z "${{ steps.inputs.outputs.server_error }}" ] || args+=(--server-error "${{ steps.inputs.outputs.server_error }}")
          python3 scripts/seo-geo-audit/triage_gsc_technical_examples.py "${args[@]}"

      - name: Count semantic candidates
        id: semantic
        if: steps.inputs.outputs.has_semantic == 'true'
        shell: bash
        run: |
          file='seo-geo-audit-out/gsc-indexing-semantic-candidates.csv'
          if [ ! -f "$file" ]; then echo 'count=0' >> "$GITHUB_OUTPUT"; exit 0; fi
          count=$(python3 - <<'PY'
          import csv
          with open('seo-geo-audit-out/gsc-indexing-semantic-candidates.csv', newline='', encoding='utf-8-sig') as f:
              print(sum(1 for _ in csv.DictReader(f)))
          PY
          )
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Build governed HERMES requests
        if: steps.inputs.outputs.has_semantic == 'true' && steps.semantic.outputs.count != '0'
        run: python3 scripts/seo-geo-audit/build_hermes_knowledge_gaps.py seo-geo-audit-out/gsc-indexing-semantic-candidates.csv --out-dir seo-geo-audit-out/gsc-hermes

      - name: Import semantic gaps as HERMES candidates
        if: steps.inputs.outputs.has_semantic == 'true' && steps.semantic.outputs.count != '0'
        run: node scripts/hermes/import-seo-knowledge-gaps.mjs seo-geo-audit-out/gsc-hermes/hermes-knowledge-gaps.json

      - name: Research GSC candidates with HERMES
        if: steps.inputs.outputs.has_semantic == 'true' && steps.semantic.outputs.count != '0'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HERMES_GROQ_MODEL: ${{ vars.HERMES_GROQ_MODEL || 'groq/compound' }}
        run: npm run hermes:research

      - name: Validate governed HERMES candidates
        if: steps.inputs.outputs.has_semantic == 'true' && steps.semantic.outputs.count != '0'
        run: npm run hermes:validate:real

      - name: Upload intake evidence and HERMES artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-indexing-intake-${{ github.run_number }}
          path: |
            seo-geo-audit-input/gsc
            seo-geo-audit-out
            hermes/real-candidates
            hermes/real-candidates-previews
            hermes/real-candidates-resolved
          if-no-files-found: warn
          retention-days: 90

      - name: Fail clearly when no detailed export was supplied
        if: steps.inputs.outputs.has_input == 'false'
        run: |
          echo 'No supported detailed GSC CSV was found under seo-geo-audit-input/gsc/.'
          exit 1
