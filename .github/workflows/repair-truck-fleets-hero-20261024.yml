name: Repair Trucks Fleets Hero Video
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-truck-fleets-hero-20261024.yml
permissions:
  contents: write
jobs:
  transcode:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install media tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Convert to browser-compatible H264
        shell: bash
        run: |
          set -euo pipefail
          src='frontend/public/images/Trucks&Feel-1.mp4'
          out='frontend/public/images/truck-fleets-hero-h264.mp4'
          test -s "$src"
          ffprobe -v error -show_entries stream=codec_name,pix_fmt,sample_aspect_ratio,display_aspect_ratio,width,height -show_entries format=duration,size -of json "$src"
          ffmpeg -hide_banner -loglevel error -nostdin -y -i "$src" -map 0:v:0 -an \
            -vf 'fps=24,scale=960:-2:force_original_aspect_ratio=decrease,setsar=1' \
            -c:v libx264 -preset medium -crf 25 -pix_fmt yuv420p -movflags +faststart "$out"
          test -s "$out"
          test "$(stat -c%s "$out")" -le 20000000
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 "$out" | tee /tmp/truck-hero-codec.txt
          grep -q '^codec_name=h264$' /tmp/truck-hero-codec.txt
          grep -q '^pix_fmt=yuv420p$' /tmp/truck-hero-codec.txt
          ls -lh "$src" "$out"
      - name: Publish verified asset to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ELIMFILTERS Video Compatibility'
          git config user.email 'actions@users.noreply.github.com'
          git add -f frontend/public/images/truck-fleets-hero-h264.mp4
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix(media): verified H264 truck fleet hero video [skip ci]'
          git push origin HEAD:refs/heads/fix/truck-fleets-h264-hero-20261024
