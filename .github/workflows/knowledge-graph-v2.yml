name: ELIMFILTERS Knowledge Graph v2

on:
  workflow_dispatch:
    inputs:
      label_communities:
        description: "Label communities with Anthropic API when ANTHROPIC_API_KEY is configured"
        required: false
        default: true
        type: boolean
      commit_results:
        description: "Commit generated reports back to main"
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "docs/knowledge-graph/**"
      - "scripts/graphify-v2-bootstrap.ps1"
      - "graphify-out/graph.json"
      - ".github/workflows/knowledge-graph-v2.yml"

permissions:
  contents: write

concurrency:
  group: knowledge-graph-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GRAPHIFY_MAX_WORKERS: "2"
      GRAPHIFY_API_TIMEOUT: "1200"
      GRAPHIFY_QUERY_LOG_DISABLE: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Graphify
        run: uv tool install "graphifyy[office,pdf,mcp,anthropic,sql]"

      - name: Verify graph
        shell: bash
        run: |
          test -f graphify-out/graph.json || {
            echo "graphify-out/graph.json is missing. Build and commit the graph before running this workflow."
            exit 1
          }

      - name: Re-cluster graph and generate report
        run: graphify cluster-only . --no-viz

      - name: Label communities
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.label_communities }}
        shell: bash
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            graphify label --backend claude --no-viz
          else
            echo "ANTHROPIC_API_KEY is not configured; semantic community labels were skipped."
          fi

      - name: Generate v2 audits
        shell: bash
        run: |
          mkdir -p graphify-out/v2-audit

          graphify query "What are the central ELIMFILTERS technologies, protection systems, standards, industries, database entities, website pages and source files? Distinguish current authoritative sources from historical reports." \
            > graphify-out/v2-audit/01-core-architecture.txt

          graphify query "Which historical reports, generated files or duplicate names collide with current source-code or canonical knowledge entities? List the affected entities and authoritative source that should win." \
            > graphify-out/v2-audit/02-collisions-and-conflicts.txt

          graphify query "What approved or technical knowledge appears in Markdown or Obsidian-style documentation but is not implemented in current website pages, APIs or canonical data files?" \
            > graphify-out/v2-audit/03-knowledge-coverage.txt

          graphify query "Which engineering claims, performance claims, standards references or field-validation statements lack a clearly connected authoritative source or evidence record?" \
            > graphify-out/v2-audit/04-evidence-gaps.txt

          cat > graphify-out/v2-audit/README.md <<'EOF'
          # ELIMFILTERS Knowledge Graph v2 — Automated Audit

          Generated by `.github/workflows/knowledge-graph-v2.yml`.

          - `01-core-architecture.txt` — central architecture and authoritative sources.
          - `02-collisions-and-conflicts.txt` — duplicate and historical/current-source conflicts.
          - `03-knowledge-coverage.txt` — documented knowledge not implemented in current systems.
          - `04-evidence-gaps.txt` — claims and standards references without clear evidence paths.

          Governing documents:

          - `docs/knowledge-graph/KNOWLEDGE_GRAPH_ARCHITECTURE_V2.md`
          - `docs/knowledge-graph/ELIMFILTERS_ONTOLOGY_V2.yaml`
          - `docs/knowledge-graph/KNOWLEDGE_GRAPH_V2_IMPLEMENTATION_ROADMAP.md`
          EOF

      - name: Upload knowledge graph audit
        uses: actions/upload-artifact@v4
        with:
          name: elimfilters-knowledge-graph-v2-${{ github.run_number }}
          path: |
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.json
            graphify-out/.graphify_analysis.json
            graphify-out/v2-audit/
          if-no-files-found: error
          retention-days: 30

      - name: Commit generated results
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.commit_results }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add graphify-out/GRAPH_REPORT.md graphify-out/graph.json graphify-out/.graphify_analysis.json graphify-out/v2-audit
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: refresh knowledge graph v2 audit"
            git push origin HEAD:main
          fi
