name: Publish Approved Master to R2

on:
  push:
    branches: [main]
    paths:
      - 'product-identity/approved-masters/*/approved-master.png'
  workflow_dispatch:
    inputs:
      image_path:
        description: 'Repository path to one approved-master.png'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-approved-master-r2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      R2_BUCKET: elimfilters-renders
      CDN_BASE: https://cdn.elimfilters.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate R2 configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$R2_ACCOUNT_ID"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$R2_BUCKET"
          test -n "$CDN_BASE"

      - name: Ensure AWS CLI
        shell: bash
        run: |
          if ! command -v aws >/dev/null 2>&1; then
            python -m pip install --user awscli
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve approved masters
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            printf '%s\n' "${{ inputs.image_path }}" > /tmp/approved-images.txt
          else
            git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" --               'product-identity/approved-masters/*/approved-master.png' > /tmp/approved-images.txt
          fi
          sed -i '/^[[:space:]]*$/d' /tmp/approved-images.txt
          test -s /tmp/approved-images.txt
          cat /tmp/approved-images.txt

      - name: Upload image and JSON manifest
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

          while IFS= read -r image; do
            test -f "$image"

            if [[ ! "$image" =~ ^product-identity/approved-masters/([A-Z0-9-]+)/approved-master\.png$ ]]; then
              echo "INVALID_APPROVED_MASTER_PATH:$image" >&2
              exit 2
            fi

            sku="${BASH_REMATCH[1]}"
            record="product-identity/approved-masters/${sku}/approval-record.json"
            test -f "$record"

            approved_at="$(node -e "const j=require('./$record');process.stdout.write(String(j.approved_on||''))")"
            sha256="$(sha256sum "$image" | awk '{print $1}')"

            node product-identity/scripts/validate-branding-approval-record.mjs \
              "--record=${record}" \
              "--image-sha=${sha256}"
            image_key="products/${sku}/approved/${sha256}.png"
            manifest_key="products/${sku}/manifest.json"
            image_url="${CDN_BASE}/${image_key}"
            manifest_url="${CDN_BASE}/${manifest_key}"
            manifest_tmp="$(mktemp)"

            node product-identity/scripts/build-r2-image-manifest.mjs \
              "--sku=${sku}" \
              "--image-url=${image_url}" \
              "--image-key=${image_key}" \
              "--sha256=${sha256}" \
              "--manifest-url=${manifest_url}" \
              "--manifest-key=${manifest_key}" \
              "--approved-at=${approved_at}" \
              "--out=${manifest_tmp}"

            aws s3 cp "$image" "s3://${R2_BUCKET}/${image_key}"               --endpoint-url "$endpoint"               --content-type image/png               --cache-control 'public,max-age=31536000,immutable'               --only-show-errors
            aws s3 cp "$manifest_tmp" "s3://${R2_BUCKET}/${manifest_key}"               --endpoint-url "$endpoint"               --content-type application/json               --cache-control 'public,max-age=60,must-revalidate'               --only-show-errors

            aws s3api head-object               --bucket "$R2_BUCKET"               --key "$image_key"               --endpoint-url "$endpoint" >/tmp/r2-image-head.json

            aws s3api head-object               --bucket "$R2_BUCKET"               --key "$manifest_key"               --endpoint-url "$endpoint" >/tmp/r2-manifest-head.json

            image_ok=0
            manifest_ok=0
            for attempt in 1 2 3 4 5 6; do
              curl -fsSI "$image_url" >/dev/null && image_ok=1 || true
              curl -fsS "$manifest_url" >/tmp/public-manifest.json && manifest_ok=1 || true
              if [ "$image_ok" = 1 ] && [ "$manifest_ok" = 1 ]; then break; fi
              sleep 5
            done
            test "$image_ok" = 1
            test "$manifest_ok" = 1

            node -e "const j=require('/tmp/public-manifest.json'); if(j.sku!=='$sku'||j.image?.sha256!=='$sha256') process.exit(2)"
            node product-identity/scripts/update-r2-storage-record.mjs               "--sku=${sku}"               "--bucket=${R2_BUCKET}"               "--key=${image_key}"               "--cdn-url=${image_url}"               "--sha256=${sha256}"               "--manifest-key=${manifest_key}"               "--manifest-url=${manifest_url}"

            echo "R2_PUBLISHED ${sku}"
            echo "IMAGE_URL ${image_url}"
            echo "JSON_URL ${manifest_url}"
            rm -f "$manifest_tmp"
          done < /tmp/approved-images.txt

      - name: Commit verified publication records
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- product-identity/production-master product-identity/approved-masters; then
            echo 'No publication-record changes.'
            exit 0
          fi
          git config user.name 'ELIMFILTERS R2 Publisher'
          git config user.email 'actions@users.noreply.github.com'
          git add product-identity/production-master product-identity/approved-masters
          git commit -m 'chore(product-images): record verified R2 golden master [skip ci]'
          git push
