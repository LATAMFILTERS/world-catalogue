name: Catalog Governance

on:
  pull_request:
    paths:
      - 'lib/catalog-*.js'
      - 'lib/bot-conversation-orchestrator.js'
      - 'lib/bot-protocol-reference-preflight.js'
      - 'lib/bot-protocol-unified-orchestrator.js'
      - 'lib/fleetguard-official-evidence.js'
      - 'scripts/audit-catalog-structural-integrity.js'
      - 'scripts/migrations/run_21*.js'
      - 'scripts/migrations/run_22*.js'
      - 'config/vehicle-platform-closure/john-deere-*.json'
      - 'scripts/audit-catalog-governance-daily.js'
      - 'scripts/catalog-historical-sanitation.js'
      - 'scripts/migrations/run_07*.js'
      - 'tests/catalog-*.test.js'
      - 'tests/industrial-sku-policy.test.mjs'
      - 'config/industrial-product-pilots/**'
      - 'product-identity/lib/industrial-sku-policy.mjs'
      - 'config/industrial-product-pilots/*-sku-preview.json'
      - 'docs/catalog/ELIMFILTERS_MASTER_CATALOG_POLICY.md'
      - 'docs/brand/PRODUCT_REGISTRY.md'
      - 'import_donaldson.py'
      - 'frontend/src/scripts/ingest-*-production.ts'
      - '.github/CODEOWNERS'
      - '.github/workflows/catalog-governance.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'lib/catalog-*.js'
      - 'lib/bot-conversation-orchestrator.js'
      - 'lib/bot-protocol-reference-preflight.js'
      - 'lib/bot-protocol-unified-orchestrator.js'
      - 'lib/fleetguard-official-evidence.js'
      - 'scripts/audit-catalog-structural-integrity.js'
      - 'scripts/migrations/run_21*.js'
      - 'scripts/migrations/run_22*.js'
      - 'config/vehicle-platform-closure/john-deere-*.json'
      - 'scripts/audit-catalog-governance-daily.js'
      - 'scripts/catalog-historical-sanitation.js'
      - 'scripts/migrations/run_07*.js'
      - 'tests/catalog-*.test.js'
      - 'tests/industrial-sku-policy.test.mjs'
      - 'config/industrial-product-pilots/**'
      - 'product-identity/lib/industrial-sku-policy.mjs'
      - 'config/industrial-product-pilots/*-sku-preview.json'
      - 'docs/catalog/ELIMFILTERS_MASTER_CATALOG_POLICY.md'
      - 'docs/brand/PRODUCT_REGISTRY.md'
      - 'import_donaldson.py'
      - 'frontend/src/scripts/ingest-*-production.ts'
      - '.github/CODEOWNERS'
      - '.github/workflows/catalog-governance.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  governance-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonical catalog governance regressions
        run: npm run catalog:governance:test
      - name: Industrial SKU nomenclature regression
        run: node --test tests/industrial-sku-policy.test.mjs
      - name: Fail if forbidden direct catalog write patterns are introduced
        run: node scripts/verify-catalog-write-boundaries.js
