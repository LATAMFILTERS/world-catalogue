name: Catalog Governance

on:
  pull_request:
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.py'
      - '.github/CODEOWNERS'
      - '.github/workflows/catalog-governance.yml'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '**/*.js'
      - '**/*.mjs'
      - '**/*.cjs'
      - '**/*.ts'
      - '**/*.py'
      - '.github/CODEOWNERS'
      - '.github/workflows/catalog-governance.yml'
      - 'package.json'

permissions:
  contents: read

jobs:
  governance-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Canonical catalog governance regressions
        run: npm run catalog:governance:test
      - name: Agency domain authority contract
        run: node --test tests/agency-domain-contract.test.js
      - name: Fail if a changed file introduces a forbidden direct catalog write
        run: node scripts/verify-catalog-write-boundaries.js
      - name: Inventory all legacy catalog write bypass debt
        env:
          CATALOG_BOUNDARY_SCAN: all
          CATALOG_BOUNDARY_REPORT_ONLY: 'true'
        run: node scripts/verify-catalog-write-boundaries.js
