name: Verify repaired truck carousel
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-truck-carousel-repair-20261024.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify eight truck-only image references
        shell: bash
        run: |
          python3 - <<'PY'
          import re,urllib.request,struct,os,json
          c=open('frontend/src/components/IndustryFilterCarousel.tsx').read()
          base=re.search(r"const R2_BASE = '([^']+)'",c).group(1)
          block=c.split("  'Trucks Fleets': {",1)[1].split("\n  },",1)[0]
          imgs=dict(re.findall(r"'([^']+)': `\$\{R2_BASE\}/([^`]+)`",block))
          assert len(imgs)==6,imgs
          for group,file in imgs.items():
            with urllib.request.urlopen(urllib.request.Request(base+'/'+file,headers={'User-Agent':'ELIMFILTERS-Carousel-Verify'}),timeout=20) as r:
              data=r.read(11000000)
              assert r.status==200
              assert data[:8]==b'\x89PNG\r\n\x1a\n',group
              w,h=struct.unpack('>II',data[16:24]);assert w>200 and h>200
            print('PASS_URL',group,file,w,h)
          for name in ['airdryer.avif','coolant-mesa.avif']:
            path='frontend/public/images/'+name
            assert os.path.getsize(path)>10000
            print('PASS_LOCAL',name,os.path.getsize(path))
          assert "industryName === 'Trucks Fleets' && family.key === 'air-dryer-filters'" in c
          assert "industryName === 'Trucks Fleets' && family.key === 'coolant-filters'" in c
          assert "'Trucks Fleets': {" in c
          print('PASS_EIGHT_TRUCK_IMAGES')
          PY
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Run TypeScript check
        working-directory: frontend
        run: npm run type-check
