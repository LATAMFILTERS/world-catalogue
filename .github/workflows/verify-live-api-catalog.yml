name: Verify live public API catalog
on:
  workflow_dispatch:
  schedule:
    - cron: '29 11 * * *'
permissions:
  contents: read
jobs:
  verify-api-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-live-api-catalog.py
