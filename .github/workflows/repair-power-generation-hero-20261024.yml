name: Repair Power Generation Hero Video
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-power-generation-hero-20261024.yml

permissions:
  contents: write

jobs:
  transcode-verified:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install video tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Transcode HEVC to browser-compatible H264
        shell: bash
        run: |
          set -euo pipefail
          src=frontend/public/images/powergenerator-Video-1.mp4
          out=frontend/public/images/powergenerator-hero-h264.mp4
          test -s "$src"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,pix_fmt,width,height -of json "$src"
          ffmpeg -hide_banner -loglevel error -nostdin -y -i "$src" -map 0:v:0 -an \
            -vf 'fps=24,scale=720:-2:force_original_aspect_ratio=decrease' \
            -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p \
            -movflags +faststart "$out"
          test -s "$out"
          test "$(stat -c%s "$out")" -le 20000000
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 "$out" | tee /tmp/codec.txt
          grep -q '^codec_name=h264$' /tmp/codec.txt
          grep -q '^pix_fmt=yuv420p$' /tmp/codec.txt
          ls -lh "$src" "$out"
      - name: Publish compatible version to review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ELIMFILTERS Video Compatibility'
          git config user.email 'actions@users.noreply.github.com'
          git add -f frontend/public/images/powergenerator-hero-h264.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'fix(media): add verified H264 power generator hero [skip ci]'
          git push origin HEAD:refs/heads/fix/powergen-h264-hero-20261024
