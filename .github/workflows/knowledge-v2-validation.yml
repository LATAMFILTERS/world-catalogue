name: Knowledge v2 Validation

on:
  pull_request:
    paths:
      - 'knowledge/**'
      - 'scripts/validate-knowledge-v2.mjs'
      - 'docs/knowledge-graph/**'
      - 'elimfilters-vault/13-canonical-knowledge/industrial-process/**'
      - 'docs/brand/INDUSTRIAL_PROCESS_*.md'
      - 'frontend/src/lib/industrial-process-architecture.ts'
      - 'frontend/src/generated/canonical-knowledge.json'
      - 'frontend/src/app/industrial-process/**'
      - 'frontend/src/components/IndustrialProcessPlatformStablePage.tsx'
      - 'frontend/src/components/IndustrialProcessTechnologyStablePage.tsx'
      - 'hermes/config/source-organizations.json'
      - 'hermes/config/source-endpoints.json'
      - 'hermes/config/intelligence-mission.json'
      - 'scripts/hermes/industrial-research-policy.mjs'
      - 'scripts/hermes/industrial-product-base-policy.mjs'
      - 'tests/hermes-phase5/industrial-product-base-policy.test.mjs'
      - 'tests/hermes-phase5/coalvex-product-pilot-01.test.mjs'
      - 'config/industrial-product-pilots/**'
      - 'ebp/phase1/validation.js'
      - 'migrations/ebp-phase1/004_industrial_process_duty.sql'
      - 'scripts/hermes/source-registry-core.mjs'
      - 'scripts/hermes/collect-real-sources-core.mjs'
      - 'tests/hermes-phase5/industrial-process-technical-closure.test.mjs'
      - '.github/workflows/knowledge-v2-validation.yml'
  push:
    branches:
      - main
    paths:
      - 'knowledge/**'
      - 'scripts/validate-knowledge-v2.mjs'
      - 'docs/knowledge-graph/**'
      - 'elimfilters-vault/13-canonical-knowledge/industrial-process/**'
      - 'docs/brand/INDUSTRIAL_PROCESS_*.md'
      - 'frontend/src/lib/industrial-process-architecture.ts'
      - 'frontend/src/generated/canonical-knowledge.json'
      - 'frontend/src/app/industrial-process/**'
      - 'frontend/src/components/IndustrialProcessPlatformStablePage.tsx'
      - 'frontend/src/components/IndustrialProcessTechnologyStablePage.tsx'
      - 'hermes/config/source-organizations.json'
      - 'hermes/config/source-endpoints.json'
      - 'hermes/config/intelligence-mission.json'
      - 'scripts/hermes/industrial-research-policy.mjs'
      - 'scripts/hermes/industrial-product-base-policy.mjs'
      - 'tests/hermes-phase5/industrial-product-base-policy.test.mjs'
      - 'tests/hermes-phase5/coalvex-product-pilot-01.test.mjs'
      - 'config/industrial-product-pilots/**'
      - 'ebp/phase1/validation.js'
      - 'migrations/ebp-phase1/004_industrial_process_duty.sql'
      - 'scripts/hermes/source-registry-core.mjs'
      - 'scripts/hermes/collect-real-sources-core.mjs'
      - 'tests/hermes-phase5/industrial-process-technical-closure.test.mjs'
      - '.github/workflows/knowledge-v2-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate canonical knowledge
        run: node scripts/validate-knowledge-v2.mjs

      - name: 'Validate Industrial & Process technical closure'
        run: node --test tests/hermes-phase5/industrial-process-technical-closure.test.mjs

      - name: 'Validate Industrial product base-code authority'
        run: node --test tests/hermes-phase5/industrial-product-base-policy.test.mjs

      - name: 'Validate COALVEX product pilot 01'
        run: node --test tests/hermes-phase5/coalvex-product-pilot-01.test.mjs

      - name: Confirm governing files
        shell: bash
        run: |
          test -f docs/knowledge-graph/KNOWLEDGE_GRAPH_ARCHITECTURE_V2.md
          test -f docs/knowledge-graph/ELIMFILTERS_ONTOLOGY_V2.yaml
          test -f docs/knowledge-graph/PHASE_1_CANONICAL_KNOWLEDGE_IMPLEMENTATION.md
          test -f knowledge/schemas/entity.schema.json
