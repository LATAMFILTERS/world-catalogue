name: Truck Fleets Page Validation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/truck-fleets-validation-20261024.yml
permissions:
  contents: read
jobs:
  types:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run type-check
      - name: Verify fleet pathways and product scopes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const source=fs.readFileSync('frontend/src/components/TrucksFleetsIndustryPage.tsx','utf8');
          const expected=['MACROCORE™','HYDROCORE™','SYNTAPORE™','SYNTRAX™','THERMACORE™','DRYCORE™','MICROKAPPA™'];
          const found=[...source.matchAll(/'([A-Z]+™)', '\/technologies\//g)].map(x=>x[1]);
          if(JSON.stringify(found)!==JSON.stringify(expected)) throw Error('Unexpected technology pathways: '+found.join(','));
          if(!source.includes('serviceChecks[technology]')) throw Error('Missing technical checks');
          if(!source.includes("maxWidth: '1560px'")) throw Error('Missing 1560px layout');
          if(!source.includes('className="miningHeroVideo"')) throw Error('Missing video hero');
          console.log('PASS: seven distinct pathways, 1560px layout, scoped checks and video hero');
          NODE
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Inspect existing truck hero media
        run: |
          set -euo pipefail
          test -s 'frontend/public/images/Trucks&Feel-1.mp4'
          test -s 'frontend/public/images/trucks-1.avif'
          ffprobe -v error -show_entries stream=codec_name,codec_type,pix_fmt,width,height -show_entries format=duration,size -of json 'frontend/public/images/Trucks&Feel-1.mp4'
