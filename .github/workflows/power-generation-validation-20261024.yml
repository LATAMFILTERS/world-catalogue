name: Power Generation Page Validation
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/power-generation-validation-20261024.yml

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend packages
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run type-check
      - name: Probe generator hero video
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          test -s frontend/public/images/powergenerator-Video-1.mp4
          ffprobe -v error -show_entries stream=codec_name,codec_type,pix_fmt,width,height -show_entries format=duration,size -of json frontend/public/images/powergenerator-Video-1.mp4
          test -s frontend/public/images/power-generator.avif
