name: Consolidated Markdown audit
on:
  pull_request:
    paths:
      - 'workers/markdown-for-agents/**'
      - '.github/workflows/markdown-batch-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  batch-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit Knowledge Center ES EN PT and discover technical tables
        run: node workers/markdown-for-agents/batch-audit.mjs
        env:
          MARKDOWN_AUDIT_LIMIT: '300'
          MARKDOWN_AUDIT_CONCURRENCY: '6'
      - name: Publish findings even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: markdown-batch-audit
          path: out/markdown-audit/
          if-no-files-found: warn
