name: Repair Oil and Gas Hero Video
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-oil-gas-hero-video.yml

permissions:
  contents: write

jobs:
  transcode-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install FFmpeg tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          command -v ffprobe
          command -v ffmpeg
      - name: Inspect original media
        shell: bash
        run: |
          set -euo pipefail
          src='frontend/public/images/Petro&Gas-1.mp4'
          test -s "$src"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=index,codec_name,codec_type,pix_fmt,width,height -of json "$src"
      - name: Create browser-compatible MP4
        shell: bash
        run: |
          set -euo pipefail
          src='frontend/public/images/Petro&Gas-1.mp4'
          out='frontend/public/images/petro-gas-hero-h264.mp4'
          ffmpeg -hide_banner -loglevel error -nostdin -y -i "$src" \
            -map 0:v:0 -an \
            -vf 'fps=24,scale=1600:-2:force_original_aspect_ratio=decrease' \
            -c:v libx264 -preset medium -crf 24 -pix_fmt yuv420p \
            -movflags +faststart "$out"
          test -s "$out"
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 "$out" \
            | tee /tmp/hero-codec.txt
          grep -q '^codec_name=h264$' /tmp/hero-codec.txt
          grep -q '^pix_fmt=yuv420p$' /tmp/hero-codec.txt
          ls -lh "$src" "$out"
      - name: Publish verified compatible media
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ELIMFILTERS Video Compatibility'
          git config user.email 'actions@users.noreply.github.com'
          git add frontend/public/images/petro-gas-hero-h264.mp4
          if git diff --cached --quiet; then
            echo 'Video already matches generated file.'
            exit 0
          fi
          git commit -m 'fix(media): publish verified H264 oil gas hero video [skip ci]'
          git push origin HEAD:main
