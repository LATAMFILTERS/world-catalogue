name: DNS-AID live readiness check
on:
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/dnsaid-readiness.yml']
permissions:
  contents: read
jobs:
  verify-public-dns:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check actual public DNS and endpoint; fail closed
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,json,sys
          def get(url):
              with urllib.request.urlopen(urllib.request.Request(url,headers={'Accept':'application/dns-json,application/json','User-Agent':'ELIMFILTERS-DNS-AID-Validator/1.0'}),timeout=15) as r:
                  return json.load(r)
          owner='_index._agents.elimfilters.com'
          result=get('https://dns.google/resolve?'+urllib.parse.urlencode({'name':owner,'type':'SVCB','do':'true'}))
          answers=[a for a in result.get('Answer',[]) if a.get('type')==64]
          print(json.dumps({'owner':owner,'dnsStatus':result.get('Status'),'AD':result.get('AD',False),'svcb':answers},indent=2))
          if result.get('Status')!=0 or not answers:
              raise SystemExit('NO-GO: No public SVCB record published for organizational agent discovery')
          if not result.get('AD'):
              raise SystemExit('NO-GO: DNSSEC authentication not confirmed by validating resolver')
          if any('elimfilters.com' not in a.get('data','') for a in answers):
              raise SystemExit('NO-GO: Unrecognized SVCB TargetName; verify TLS and live service before acceptance')
          print('DNS-AID DNS check passed; application-layer agent registry still requires independent validation.')
          PY
