name: Patch commercial retry runtime
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-commercial-retry-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Add retry worker hook
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('server-original.js')
          t=p.read_text()
          needle="require('./lib/install-commercial-intelligence').installCommercialIntelligence(app);"
          add=needle+"\nrequire('./lib/install-commercial-intelligence-retry').installCommercialIntelligenceRetry();"
          if "installCommercialIntelligenceRetry()" not in t:
              if needle not in t: raise SystemExit('commercial intelligence hook missing')
              t=t.replace(needle,add,1)
              p.write_text(t)
          PY
      - name: Verify
        run: |
          node --check lib/install-commercial-intelligence-retry.js
          node --check server-original.js
          grep -F "installCommercialIntelligenceRetry()" server-original.js
      - name: Commit
        run: |
          git config user.name "ELIMFILTERS Automation"
          git config user.email "automation@elimfilters.com"
          git add server-original.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Enable durable CRM delivery retries"
          git pull --rebase origin main
          git push origin HEAD:main
