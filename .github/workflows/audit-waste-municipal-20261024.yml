name: Municipal Public Service Page Audit
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/audit-waste-municipal-20261024.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Probe municipal filter carousel images
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,json,struct
          s=open('frontend/src/components/IndustryFilterCarousel.tsx',encoding='utf8').read()
          base=re.search(r"const R2_BASE = '([^']+)'",s).group(1)
          block=s.split("  'Waste Municipal': {",1)[1].split("\n  },",1)[0]
          images=re.findall(r"'([^']+)': `\$\{R2_BASE\}/([^`]+)`",block)
          for name in ('AIR_DRYER_IMAGE','COOLANT_IMAGE'):
            m=re.search(r"const "+name+r" = `\$\{R2_BASE\}/([^`]+)`",s)
            if m:images.append((name,m.group(1)))
          print('MUNICIPAL_IMAGE_COUNT',len(images),flush=True)
          for family,name in images:
            try:
              req=urllib.request.Request(base+'/'+name,headers={'User-Agent':'ELIMFILTERS-Municipal-Images','Accept':'image/*'})
              with urllib.request.urlopen(req,timeout=18) as r:
                data=r.read(15000000)
                valid=data[:8]==bytes([137,80,78,71,13,10,26,10])
                size=struct.unpack('>II',data[16:24]) if valid else ()
                print('MUNICIPAL_IMAGE '+json.dumps({'family':family,'file':name,'http':r.status,'png':valid,'dimensions':size,'bytes':len(data)}),flush=True)
            except urllib.error.HTTPError as ex:print('MUNICIPAL_IMAGE '+json.dumps({'family':family,'file':name,'http':ex.code}),flush=True)
            except Exception as ex:print('MUNICIPAL_IMAGE '+json.dumps({'family':family,'file':name,'error':str(ex)}),flush=True)
          PY
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Probe municipal video
        shell: bash
        run: |
          test -s frontend/public/images/wasted-2.mp4
          test -s frontend/public/images/wasted.avif
          ffprobe -v error -show_entries stream=codec_name,codec_type,pix_fmt,width,height -show_entries format=duration,size -of json frontend/public/images/wasted-2.mp4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run type-check
