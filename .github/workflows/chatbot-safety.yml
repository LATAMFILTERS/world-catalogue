name: Chatbot safety gate
on:
  pull_request:
    paths:
      - server-original.js
      - frontend/src/components/ui/ChatBot.tsx
      - scripts/verify-chatbot-safety.js
      - .github/workflows/chatbot-safety.yml
  push:
    branches: [main]
jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check server-original.js
      - run: node scripts/verify-chatbot-safety.js
