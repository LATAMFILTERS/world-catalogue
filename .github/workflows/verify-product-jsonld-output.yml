name: Diagnose live product JSON-LD output
on:
  pull_request:
    paths: ['.github/workflows/verify-product-jsonld-output.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Examine actual script tags and product schema in public HTML
        run: |
          python3 - <<'PY'
          import urllib.request,re,json
          pages=['ea13648','ed47754','es91026','el83191']
          failures=[]
          for sku in pages:
              url='https://elimfilters.com/products/'+sku+'/'
              req=urllib.request.Request(url,headers={'User-Agent':'ELIMFILTERS-ProductSchemaVerification/1.0'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  body=r.read(1200000).decode('utf-8','replace')
                  code=r.status
              tags=re.findall(r'<script\\b[^>]*>',body,re.I)
              ld_tags=[t for t in tags if 'ld+json' in t.lower()]
              blocks=re.findall(r'<script\\b([^>]*)>([\\s\\S]*?)</script\\s*>',body,re.I)
              types=[];parse_errors=0;raw_sample=None
              for attrs,payload in blocks:
                  if not re.search(r'\\btype\\s*=\\s*["\\x27]application/ld\\+json["\\x27]',attrs,re.I):continue
                  raw_sample=payload[:110]
                  try:
                      obj=json.loads(payload)
                      values=obj if isinstance(obj,list) else [obj]
                      for v in values:
                          if isinstance(v,dict):types.append(v.get('@type'))
                  except Exception:parse_errors+=1
              sample_i=body.find('schema.org')
              print('SCHEMA_CONTEXT',sku,repr(body[max(0,sample_i-180):sample_i+300]))
              print(json.dumps({'sku':sku,'status':code,'ld_tag_count':len(ld_tags),'ld_tags':ld_tags[:2],'parsed_types':types,'parse_errors':parse_errors,'body_mentions_product':body.count('schema.org'),'raw_sample':raw_sample},ensure_ascii=False))
              if code!=200:failures.append(sku+': non-200')
          if failures:raise SystemExit('; '.join(failures))
          PY
