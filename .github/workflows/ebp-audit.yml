name: EBP Phase 1-5 Audit

on:
  pull_request:
    paths:
      - 'ebp/**'
      - 'tests/ebp-phase*/**'
      - 'migrations/ebp-phase*/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ebp-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'ebp/**'
      - 'tests/ebp-phase*/**'
      - 'migrations/ebp-phase*/**'
      - 'server.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ebp-audit.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run EBP phase 1-5 tests
        run: npm run test:ebp

      - name: Syntax-check server wiring
        run: node --check server.js

      - name: Syntax-check EBP modules
        shell: bash
        run: |
          find ebp -type f -name '*.js' -print0 | xargs -0 -n1 node --check
