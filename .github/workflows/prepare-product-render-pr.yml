name: Prepare Product Render Request

on:
  push:
    branches: [main]
    paths:
      - 'product-identity/render-requests/*.json'
  pull_request:
    branches: [main]
    paths:
      - 'product-identity/render-requests/*.json'

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_READONLY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install runtime
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          python3 -m pip install pillow
      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            request=$(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- 'product-identity/render-requests/*.json' | tail -n 1)
          else
            request=$(find product-identity/render-requests -maxdepth 1 -type f -name '*.json' | sort | tail -n 1)
          fi
          test -n "$request"
          echo "request=$request" >> "$GITHUB_OUTPUT"
          node - "$request" >> "$GITHUB_OUTPUT" <<'NODE'
          const fs=require('fs'); const j=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          console.log(`brand=${String(j.brand).toUpperCase()}`);
          console.log(`code=${String(j.code).toUpperCase()}`);
          console.log(`product_url=${j.product_url}`);
          NODE
      - name: Prepare packet
        run: |
          test -n "$DATABASE_URL"
          node product-identity/scripts/prepare-product-render.mjs \
            "--brand=${{ steps.req.outputs.brand }}" \
            "--code=${{ steps.req.outputs.code }}" \
            "--product-url=${{ steps.req.outputs.product_url }}" \
            --phase=PHASE_2
      - name: Build compact visual evidence
        shell: bash
        run: |
          set -euo pipefail
          code='${{ steps.req.outputs.code }}'
          evidence="product-identity/source-assets/${code}/${code}-source-evidence.json"
          source_path=$(node -p "JSON.parse(require('fs').readFileSync('$evidence','utf8')).source_image_path")
          screenshot_path=$(node -p "JSON.parse(require('fs').readFileSync('$evidence','utf8')).screenshot_path || ''")
          mkdir -p product-identity/render-results
          python3 - "$source_path" "product-identity/render-results/${code}-official-source-preview.jpg" <<'PY'
          from PIL import Image
          import sys
          src,out=sys.argv[1],sys.argv[2]
          im=Image.open(src).convert('RGB')
          im.thumbnail((1000,1000))
          im.save(out,'JPEG',quality=82,optimize=True)
          PY
          base64 -w0 "product-identity/render-results/${code}-official-source-preview.jpg" > "product-identity/render-results/${code}-official-source-preview.b64"
          if [ -n "$screenshot_path" ] && [ -f "$screenshot_path" ]; then
            python3 - "$screenshot_path" "product-identity/render-results/${code}-official-page-preview.jpg" <<'PY'
          from PIL import Image
          import sys
          src,out=sys.argv[1],sys.argv[2]
          im=Image.open(src).convert('RGB')
          im.thumbnail((1200,1600))
          im.save(out,'JPEG',quality=72,optimize=True)
          PY
            base64 -w0 "product-identity/render-results/${code}-official-page-preview.jpg" > "product-identity/render-results/${code}-official-page-preview.b64"
          fi
      - name: Upload preparation artifact
        uses: actions/upload-artifact@v4
        with:
          name: render-prep-${{ steps.req.outputs.code }}
          path: |
            product-identity/source-assets/${{ steps.req.outputs.code }}/
            product-identity/render-packets/${{ steps.req.outputs.code }}.phase_2.authorized.json
            product-identity/render-results/${{ steps.req.outputs.code }}-official-source-preview.jpg
            product-identity/render-results/${{ steps.req.outputs.code }}-official-page-preview.jpg
          if-no-files-found: error
          retention-days: 7
      - name: Commit packet and compact evidence on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          code='${{ steps.req.outputs.code }}'
          git config user.name 'ELIMFILTERS Render Prep Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add "product-identity/source-assets/${code}/${code}-source-evidence.json" \
                  "product-identity/render-packets/${code}.phase_2.authorized.json" \
                  "product-identity/render-results/${code}-official-source-preview.b64"
          if [ -f "product-identity/render-results/${code}-official-page-preview.b64" ]; then
            git add "product-identity/render-results/${code}-official-page-preview.b64"
          fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(product-images): prepare authorized render ${code}"
          git push
