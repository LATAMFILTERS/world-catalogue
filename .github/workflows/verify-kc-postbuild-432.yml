name: Verify KC Postbuild 432

on:
  push:
    branches:
      - verify-kc-postbuild-432
  workflow_dispatch:

jobs:
  verify-kc-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend and run postbuild guards
        working-directory: frontend
        run: npm run build

      - name: Verify governed canonical outputs exist
        shell: bash
        run: |
          set -euo pipefail
          test -f frontend/out/knowledge-center/glossary/iso-cleanliness-code/index.html
          test -f frontend/out/knowledge-center/engineering-reference/fluid-cleanliness/index.html
          test -f frontend/out/knowledge-center/diagrams/iso-4406-cleanliness-scale/index.html
          test -f frontend/out/knowledge-center/standards/iso-4406/index.html
          echo "KC governed output files present"
