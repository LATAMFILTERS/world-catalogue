name: Verify public agent registry safety
on:
  pull_request:
    paths:
      - 'frontend/public/.well-known/agent-registry.json'
      - 'frontend/public/.well-known/ai-catalog.json'
      - 'config/elimserver/agents.json'
      - 'scripts/verify-public-agent-registry.mjs'
      - '.github/workflows/verify-public-agent-registry.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-agent-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/verify-public-agent-registry.mjs
  live-public-endpoint:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Verify actual HTTPS public registry; fail closed
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, sys
          url = 'https://elimfilters.com/.well-known/agent-registry.json'
          req = urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'ELIMFILTERS-Public-Agent-Discovery-Audit/1.0'})
          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  code = response.status
                  ctype = response.headers.get('Content-Type','').lower()
                  raw = response.read(131073)
          except Exception as exc:
              sys.exit(f'NO-GO: HTTPS endpoint inaccessible: {type(exc).__name__}: {exc}')
          if code != 200 or 'application/json' not in ctype or len(raw) > 131072:
              sys.exit(f'NO-GO: invalid HTTPS response status={code} content-type={ctype} bytes={len(raw)}')
          try:
              data = json.loads(raw)
          except Exception as exc:
              sys.exit(f'NO-GO: invalid JSON: {exc}')
          expected = {
              'schemaVersion': '1.0',
              'status': 'ACTIVE',
              'dnsAidAdvertised': True,
              'protocol': 'informational-read-only'
          }
          for key, value in expected.items():
              if data.get(key) != value: sys.exit(f'NO-GO: {key} differs from approved safe registry')
          agents=data.get('agents')
          if not isinstance(agents,list) or len(agents)!=1 or not isinstance(data.get('resources'),list):
              sys.exit('NO-GO: expected exactly one public discovery agent')
          agent=agents[0]
          for k,v in {
              'id':'public-discovery',
              'protocol':'https',
              'endpoint':'https://elimfilters.com/.well-known/public-discovery-agent.json',
              'method':'GET',
              'mode':'read-only',
              'public':True,
              'access':'anonymous'
          }.items():
              if agent.get(k)!=v: sys.exit(f'NO-GO: agent {k} mismatch')
          endpoint=urllib.request.Request(agent['endpoint'],headers={'Accept':'application/json'})
          try:
              with urllib.request.urlopen(endpoint,timeout=20) as service:
                  if service.status!=200 or 'application/json' not in service.headers.get('Content-Type',''):
                      sys.exit('NO-GO: public agent endpoint not JSON HTTP 200')
                  document=json.load(service)
          except Exception as exc:
              sys.exit(f'NO-GO: public agent endpoint unavailable: {exc}')
          if document.get('mode')!='read-only' or document.get('restrictions',{}).get('noPrivateAgents') is not True:
              sys.exit('NO-GO: unsafe live agent document')
          policy = data.get('policy') or {}
          for key in ('publicAgentEndpointsRequireIndependentVerification', 'internalAgentsNotPublic','applicationsWithoutVerifiedEvidenceExcluded','crossReferencesDoNotEstablishCompatibility'):
              if policy.get(key) is not True: sys.exit(f'NO-GO: missing safety policy {key}')
          if policy.get('automaticPublication') is not False:
              sys.exit('NO-GO: automatic publication may not be enabled')
          print('HTTP 200, one active public read-only discovery agent and live document verified.')
          print('DNS-AID DNS record evidence separately verified; public resource discovery only, not callable A2A/MCP.')
          PY
