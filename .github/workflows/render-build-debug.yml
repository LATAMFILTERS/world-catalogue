name: Render Build Debug

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/**'
      - '.github/workflows/render-build-debug.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build and capture log
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee ../render-build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-build-log
          path: render-build.log
