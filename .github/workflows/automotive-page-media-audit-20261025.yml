name: Automotive Page Image and Video Audit
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/automotive-page-media-audit-20261025.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - name: Probe four light-duty images
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,json,struct
          s=open('frontend/src/components/IndustryFilterCarousel.tsx',encoding='utf8').read()
          base=re.search(r"const R2_BASE = '([^']+)'",s).group(1)
          block=s.split('const LD_IMAGES:',1)[1].split('};',1)[0]
          images=re.findall(r"'([^']+)': `\$\{R2_BASE\}/([^`]+)`",block)
          for family,filename in images:
            try:
              req=urllib.request.Request(base+'/'+filename,headers={'User-Agent':'ELIMFILTERS-Automotive-Image-Audit','Accept':'image/*'})
              with urllib.request.urlopen(req,timeout=23) as r:
                data=r.read(16000000)
                png=data[:8]==bytes([137,80,78,71,13,10,26,10])
                dims=struct.unpack('>II',data[16:24]) if png else ()
                print('AUTO_IMAGE '+json.dumps({'family':family,'file':filename,'http':r.status,'png':png,'dimensions':dims,'bytes':len(data)}),flush=True)
            except urllib.error.HTTPError as e:print('AUTO_IMAGE '+json.dumps({'family':family,'file':filename,'http':e.code}),flush=True)
            except Exception as e:print('AUTO_IMAGE '+json.dumps({'family':family,'file':filename,'error':str(e)}),flush=True)
          PY
      - name: Install ffprobe
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Inspect automotive hero codec
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/public/images/Autos-Vin4.mp4
          test -s frontend/public/images/autos-02.avif
          ffprobe -v error -show_entries stream=codec_name,codec_type,pix_fmt,width,height -show_entries format=duration,size -of json frontend/public/images/Autos-Vin4.mp4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check TypeScript
        working-directory: frontend
        run: npm run type-check
