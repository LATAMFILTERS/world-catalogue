name: Verify live MCP card and anonymous access denial
on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * *'
permissions:
  contents: read
jobs:
  verify-live-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/verify-live-mcp-public-card.py
