name: Prepare Manufacturing H264 Video
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-manufacturing-h264-20261024.yml
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify replacement oil-filter product
        shell: bash
        run: |
          set -euo pipefail
          base='https://pub-fee72f3f35274550bd8a47b181823e33.r2.dev/fleetguard/page-1/01-20'
          for filename in 'EL84407-SYNTRAX-approved-opt.png' 'EL81807.png'; do
            if curl --fail --show-error --silent --location --max-time 30 "$base/$filename" --output /tmp/manufacturing-oil-filter; then
              file --mime-type /tmp/manufacturing-oil-filter | grep -q 'image/png'
              echo "VALID_OIL_IMAGE $filename $(stat -c%s /tmp/manufacturing-oil-filter)"
            else echo "UNAVAILABLE_OIL_IMAGE $filename"; fi
          done
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Convert original manufacturing footage to H264
        shell: bash
        run: |
          set -euo pipefail
          src='frontend/public/images/Manufacture-1.mp4'
          out='frontend/public/images/manufacturing-hero-h264.mp4'
          test -s "$src"
          ffmpeg -hide_banner -loglevel error -nostdin -y -i "$src" -map 0:v:0 -an -vf 'fps=24,scale=1280:-2:force_original_aspect_ratio=decrease,setsar=1' -c:v libx264 -preset medium -crf 23 -pix_fmt yuv420p -movflags +faststart "$out"
          test -s "$out"
          test "$(stat -c%s "$out")" -le 20000000
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,pix_fmt,width,height -of default=noprint_wrappers=1 "$out" | tee /tmp/manufacturing-video-codec
          grep -qx 'codec_name=h264' /tmp/manufacturing-video-codec
          grep -qx 'pix_fmt=yuv420p' /tmp/manufacturing-video-codec
          ls -lh "$src" "$out"
      - name: Publish verified H264 in review branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ELIMFILTERS Media Validation'
          git config user.email 'actions@users.noreply.github.com'
          git add -f frontend/public/images/manufacturing-hero-h264.mp4
          git diff --cached --quiet && exit 0
          git commit -m 'fix(media): add verified H264 manufacturing hero [skip ci]'
          git push origin HEAD:refs/heads/fix/manufacturing-h264-20261024
