name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - frontend-draft-cloudflare
      - main
    # This deploys the checked-out `public/` directory verbatim -- a push
    # that doesn't touch it has nothing new to deploy. Restricting to that
    # path (plus the workflow file itself) cut ~1,800 redundant runs/month
    # without changing what gets published.
    paths:
      - 'public/**'
      - '.github/workflows/cloudflare-pages.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    name: Deploy to Cloudflare Pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "world-catalogue"
          directory: "public"
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
