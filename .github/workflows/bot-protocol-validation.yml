name: Bot Protocol Validation

on:
  pull_request:
    paths:
      - 'lib/bot-protocol-*.js'
      - 'lib/bot-conversation-orchestrator.js'
      - 'tests/bot-protocol-*.test.js'
      - 'scripts/migrations/010_racor_turbine_official_compatibility.sql'
      - 'scripts/import_parker_turbine.sql'
      - 'package.json'
      - '.github/workflows/bot-protocol-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.20.2'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check protocol modules
        run: |
          node --check lib/bot-protocol-catalog.js
          node --check lib/bot-protocol-memory.js
          node --check lib/bot-protocol-unified-orchestrator.js
          node --check lib/bot-protocol.js

      - name: Run protocol unit tests
        run: npm run test:bot-protocol

      - name: Run protocol E2E tests
        run: npm run test:bot-e2e
