name: Normalize public entity signals

on:
  push:
    branches: [main]
    paths:
      - 'scripts/normalize-public-entity-signals.mjs'
      - '.github/workflows/normalize-public-entity-signals.yml'

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Normalize public-facing entity signals
        run: node scripts/normalize-public-entity-signals.mjs
      - name: Commit normalized public copy
        run: |
          if git diff --quiet; then
            echo "No normalization changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src frontend/public/locales
          git commit -m "Normalize ELIMFILTERS public scale and claim governance"
          git push
