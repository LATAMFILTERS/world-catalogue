name: Verify Municipal Carousel Correction
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-municipal-carousel-correction-20261024.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify seven exact municipal images
        shell: bash
        run: |
          set -euo pipefail
          base='https://pub-fee72f3f35274550bd8a47b181823e33.r2.dev/fleetguard/page-1/01-20'
          files=(
            'EA11132-MACROCORE-approved-opt.png'
            'ED47754.png'
            'EC14547-MICROKAPPA-approved-opt.png'
            'EF91311.png'
            'EL80920-SYNTRAX-approved-opt.png'
            'ES90588.png'
            'EW74685.png'
          )
          for f in "${files[@]}"; do
            curl --fail --show-error --silent --location --max-time 25 "$base/$f" --output /tmp/municipal-slide
            file --mime-type /tmp/municipal-slide | grep -q 'image/png'
            test "$(stat -c%s /tmp/municipal-slide)" -gt 1000
            echo "PASS $f"
          done
          node <<'NODE'
          const fs = require('fs');
          const s=fs.readFileSync('frontend/src/components/IndustryFilterCarousel.tsx','utf8');
          const line=s.match(/const MUNICIPAL_KEYS: FamilyKey\[\] = \[([^\]]+)\]/);
          if(!line)throw Error('Municipal family list missing');
          const keys=[...line[1].matchAll(/'([^']+)'/g)].map(x=>x[1]);
          const expected=['primary-air','air-dryer-filters','cabin-filters','primary-fuel','oil-filters','fuel-water-separators','coolant-filters'];
          if(JSON.stringify(keys)!==JSON.stringify(expected))throw Error('Wrong slide order: '+keys.join(','));
          const m=s.split("  'Waste Municipal': {",2)[1].split('\n  },')[0];
          if(m.includes('EC16090')||m.includes('hydraulic-filters'))throw Error('Unexpected municipal slide');
          if(!m.includes("'primary-fuel': `${R2_BASE}/EF91311.png`") || !m.includes("'fuel-water-separators': `${R2_BASE}/ES90588.png`"))throw Error('Incorrect fuel technology mapping');
          console.log('PASS 7 correct municipal slides');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        working-directory: frontend
        run: npm run type-check
