name: Search Engine

on:
  pull_request:
  push:
    branches:
      - main

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 20

    - run: npm install

    - run: node tests/autocomplete.test.js

    - run: npm run build

    - run: node tests/search.test.js
