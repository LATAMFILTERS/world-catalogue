name: Verify Truck Fleet Images
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-trucks-fleets-seven-images-20261024.yml
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check seven image URLs
        shell: bash
        run: |
          set -euo pipefail
          prefix='https://pub-fee72f3f35274550bd8a47b181823e33.r2.dev/fleetguard/page-1/01-20/'
          files=('EA17682.png' 'EF97440.png' 'EL81807.png' 'ES91242.png' 'EC14547-MICROKAPPA-approved-opt.png' 'EW74685.png' 'ED43571.png')
          for filename in "${files[@]}"; do
            echo "Checking ${filename}"
            curl --fail --show-error --silent --location --retry 2 --max-time 30 "${prefix}${filename}" --output /tmp/truck-carousel-image
            file --mime-type /tmp/truck-carousel-image | grep -q 'image/png'
            test "$(stat -c%s /tmp/truck-carousel-image)" -gt 1000
            echo "PASS ${filename}"
          done
          echo SEVEN_IMAGES_HTTP_200_VALID_PNG
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: TypeScript
        working-directory: frontend
        run: npm run type-check
