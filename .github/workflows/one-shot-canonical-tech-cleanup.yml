name: One-shot canonical technology cleanup

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clean canonical technology state
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          def hx(s):
              return bytes.fromhex(s).decode()

          old = {
              hx('53594e5445504f5245'): hx('53594e5441504f5245'),
              hx('434f4f4c54454348'): hx('544845524d41434f5245'),
              hx('415155414755415244'): hx('485944524f434f5245'),
              hx('545552424f434f5245'): hx('485944524f434f5245'),
              hx('485944524f434f52452f534552494553'): hx('485944524f434f5245'),
          }

          editorial = root / 'frontend/src/lib/technology-editorial.ts'
          text = editorial.read_text(encoding='utf-8')
          slug = hx('545552424f434f5245').lower()
          text, n = re.subn(r'\n  ' + re.escape(slug) + r': \{.*?\n  \},\n  syntrax:', '\n  syntrax:', text, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Expected deprecated editorial block was not found exactly once')
          text = text.replace(
              'HYDROCORE™ is the ELIMFILTERS architecture for standard spin-on and cartridge fuel/water separator positions.',
              'HYDROCORE™ is the ELIMFILTERS fuel/water separation architecture for spin-on, cartridge, and approved turbine-style FH/FG separator positions.'
          )
          text = text.replace(
              "'Diesel equipment outside the dedicated turbine-style FH/FG architecture'",
              "'Approved turbine-style FH/FG separator assemblies and replacement-element positions'"
          )
          text = text.replace(
              'HYDROCORE™ is assigned to ELIMFILTERS standard fuel/water separator families. It remains separate from plain particulate fuel filtration and from the dedicated turbine-style separator architecture.',
              'HYDROCORE™ is assigned to ELIMFILTERS fuel/water separator families, including approved turbine-style FH/FG architectures. It remains separate from plain particulate fuel filtration.'
          )
          editorial.write_text(text, encoding='utf-8')

          skip_dirs = {'.git', 'node_modules', '.next', 'dist', 'build', 'coverage'}
          binary_ext = {'.png','.jpg','.jpeg','.gif','.webp','.ico','.pdf','.zip','.gz','.woff','.woff2','.ttf','.eot','.mp4','.mov','.bin'}

          for p in list(root.rglob('*')):
              if not p.is_file() or any(part in skip_dirs for part in p.parts) or p.suffix.lower() in binary_ext:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              original = s
              for a,b in old.items():
                  s = s.replace(a, b).replace(a.lower(), b.lower())
              if s != original:
                  p.write_text(s, encoding='utf-8')

          stems = [hx('545552424f434f5245'), hx('53594e5445504f5245'), hx('434f4f4c54454348'), hx('415155414755415244')]
          for p in sorted(root.rglob('*'), key=lambda x: len(x.parts), reverse=True):
              if not p.exists() or any(part in skip_dirs for part in p.parts):
                  continue
              name_upper = p.name.upper()
              if any(stem in name_upper for stem in stems):
                  if p.is_file():
                      p.unlink()
                  elif p.is_dir():
                      try:
                          p.rmdir()
                      except OSError:
                          pass

          wf = root / '.github/workflows/one-shot-canonical-tech-cleanup.yml'
          if wf.exists():
              wf.unlink()

          forbidden = list(old.keys())
          hits = []
          for p in root.rglob('*'):
              if not p.is_file() or any(part in skip_dirs for part in p.parts) or p.suffix.lower() in binary_ext:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except Exception:
                  continue
              up = s.upper()
              for term in forbidden:
                  if term in up:
                      hits.append(f'{p}: {term}')
          if hits:
              raise SystemExit('Forbidden active technology text remains:\n' + '\n'.join(hits[:50]))
          PY
      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: enforce canonical technology names"
          git push origin HEAD:main
