name: Repository Guardian

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  # ── Job 1: PR Type Check ──────────────────────────────────────────────────
  pr-type:
    name: PR Type (no mixed source + generated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect PR type
        env:
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/detect-pr-type.sh main

  # ── Job 2: Validators (fast — no build) ──────────────────────────────────
  validate:
    name: Validation Gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Foundation compliance
        run: npx tsx scripts/validate-foundation.ts

      - name: Services integrity
        run: npx tsx scripts/validate-services.ts

      - name: Vault validation
        run: node ../scripts/build-citation-index.js --validate

      - name: Citation API validation
        run: node ../scripts/generate-citation-api.js --validate

      - name: KC graph integrity (Phase 5B)
        run: npx tsx scripts/validate-kc-integrity.ts

  # ── Job 3: Build (slow — runs after validators pass) ─────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: validate
    if: github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-out
          path: frontend/out/
          retention-days: 3
          if-no-files-found: error
