name: Migrate Product Identity Clean

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-product-identity-clean.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Restore Product Identity only from PR 308 head
        run: |
          set -euo pipefail
          git fetch origin 92976b973d9cbb7ef274b44457377a2cc0f777b1
          git checkout 92976b973d9cbb7ef274b44457377a2cc0f777b1 -- product-identity

      - name: Remove temporary migration workflow
        run: git rm .github/workflows/migrate-product-identity-clean.yml

      - name: Commit clean Product Identity migration
        run: |
          set -euo pipefail
          git config user.name "ELIMFILTERS Product Identity Bot"
          git config user.email "actions@users.noreply.github.com"
          git add product-identity
          if git diff --cached --quiet; then
            echo "No migration changes detected."
          else
            git commit -m "feat: migrate clean Product Identity system from PR 308"
            git push origin HEAD:main
          fi
