name: Apply part search UI fix

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ui-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Repair part search typography and controls
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('part-search/index.html')
          html = path.read_text(encoding='utf-8-sig')

          html = html.replace(
              'https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap',
              'https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;500;600;700&display=swap'
          )
          html = html.replace("'Outfit', sans-serif", "'Barlow', sans-serif")
          html = html.replace("'JetBrains Mono', monospace", "'Barlow Condensed', sans-serif")
          html = html.replace("'JetBrains Mono',monospace", "'Barlow Condensed',sans-serif")

          for bad in ('SEARCH â†’', 'SEARCH →'):
              html = html.replace(bad, 'SEARCH')
          html = html.replace('<span class="input-icon" aria-hidden="true">âŒ•</span>', '')

          mobile_fix = r'''

          /* ELIMFILTERS approved typography + clean search controls */
          html, body,
          button, input, select, textarea {
            font-family: 'Barlow', sans-serif;
          }

          .intro-label,
          .mode-tab,
          .logo-badge,
          .duty-chip,
          .btn-search,
          .footer-line,
          .status-msg,
          .field-label {
            font-family: 'Barlow Condensed', sans-serif;
          }

          .intro-label {
            font-weight: 500;
            letter-spacing: 0.12em;
          }

          .mode-tab,
          .duty-chip,
          .field-label {
            font-weight: 500;
            letter-spacing: 0.12em;
          }

          .input-icon { display: none !important; }

          .input-wrap input {
            font-family: 'Barlow', sans-serif;
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.02em;
            padding: 0.9rem 1rem;
          }

          .input-wrap input::placeholder {
            color: rgba(255,255,255,0.34);
            opacity: 1;
          }

          .btn-search {
            min-width: 220px;
            min-height: 56px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.9rem 2.25rem;
            font-size: 1rem;
            font-weight: 600;
            line-height: 1;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            border-radius: 3px;
            overflow: hidden;
          }

          .btn-search::before,
          .btn-search::after {
            content: none !important;
            display: none !important;
          }

          @media (max-width: 640px) {
            #ui {
              justify-content: flex-start;
              padding: 7.5rem 1rem 3rem;
            }

            .intro-label {
              width: 100%;
              max-width: 22rem;
              margin: 0 auto 2rem;
              font-size: clamp(1.55rem, 7.5vw, 2.15rem);
              line-height: 1.12;
              text-align: center;
            }

            #search-panel {
              width: 100%;
              max-width: 100%;
            }

            .mode-tabs {
              display: grid;
              grid-template-columns: repeat(3, minmax(0, 1fr));
            }

            .mode-tab {
              width: 100%;
              min-width: 0;
              padding: 0.7rem 0.25rem;
              font-size: 0.82rem;
              letter-spacing: 0.08em;
            }

            .field-label {
              font-size: 0.82rem;
            }

            .input-wrap {
              min-height: 58px;
            }

            .input-wrap input {
              width: 100%;
              font-size: 1rem;
              padding: 1rem;
            }

            .form-footer {
              margin-top: 1.25rem;
            }

            .btn-search {
              width: min(100%, 360px);
              min-width: 0;
              min-height: 58px;
              font-size: 1rem;
              letter-spacing: 0.2em;
            }
          }
          '''

          marker = '</style>'
          if 'ELIMFILTERS approved typography + clean search controls' not in html:
              html = html.replace(marker, mobile_fix + '\n' + marker, 1)

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit generated repair to automation branch
        id: commit
        env:
          BRANCH_NAME: automation/part-search-ui-fix
        run: |
          git config user.name "elimfilters-bot"
          git config user.email "elimfilters@gmail.com"
          git add part-search/index.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git switch -C "$BRANCH_NAME"
          git commit -m "Fix part search typography and clean search button [skip ui-fix]"
          git push --force origin "HEAD:$BRANCH_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Open or update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_NAME: automation/part-search-ui-fix
        run: |
          existing_pr="$(gh pr list --base main --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')"

          if [ -n "$existing_pr" ]; then
            gh pr edit "$existing_pr" --title "Fix part search typography and clean search button" --body "Automated UI repair generated by the protected-main workflow. This pull request replaces the previous direct push to main."
          else
            gh pr create --base main --head "$BRANCH_NAME" --title "Fix part search typography and clean search button" --body "Automated UI repair generated by the protected-main workflow. Review and merge through the repository's required pull-request process."
          fi
