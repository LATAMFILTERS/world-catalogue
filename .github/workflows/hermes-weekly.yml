name: HERMES Weekly Intelligence Collection

on:
  workflow_dispatch:
    inputs:
      promote_baseline:
        description: 'Promote a freshly generated baseline preview onto the hermes-state branch. Manual-only.'
        type: boolean
        default: false
      rollback_backup_name:
        description: 'Exact backup filename under state/backups/ on hermes-state to restore.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: hermes-weekly
  cancel-in-progress: false

jobs:
  promote-baseline:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.promote_baseline == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hermes-baseline-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Generate a fresh baseline preview
        env:
          HERMES_BASELINE_MODE: 'true'
          HERMES_COLLECTION_DRY_RUN: 'true'
        run: npm run hermes:collect
      - name: Promote preview to hermes-state
        id: promote
        continue-on-error: true
        env:
          HERMES_BASELINE_MODE: 'true'
          HERMES_BASELINE_PROMOTE: 'true'
          HERMES_COLLECTION_DRY_RUN: 'true'
          HERMES_BASELINE_APPROVAL_TOKEN: ${{ secrets.HERMES_BASELINE_APPROVAL_TOKEN }}
        run: npm run hermes:baseline:promote
      - name: Upload promotion artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-baseline-promotion
          path: hermes/baselines
          if-no-files-found: warn

  rollback-baseline:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_backup_name != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: hermes-baseline-state
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Roll back hermes-state baseline
        env:
          HERMES_BASELINE_APPROVAL_TOKEN: ${{ secrets.HERMES_BASELINE_APPROVAL_TOKEN }}
        run: npm run hermes:baseline:rollback -- "${{ github.event.inputs.rollback_backup_name }}"

  weekly-collection:
    needs: [promote-baseline, rollback-baseline]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HERMES_COLLECTION_DRY_RUN: ${{ vars.HERMES_COLLECTION_DRY_RUN || 'true' }}
      HERMES_BASELINE_MODE: ${{ vars.HERMES_BASELINE_MODE || 'false' }}
      HERMES_MAX_SOURCES_PER_RUN: ${{ vars.HERMES_MAX_SOURCES_PER_RUN || '35' }}
      HERMES_REVIEW_BASE_URL: ${{ vars.HERMES_REVIEW_BASE_URL || 'https://elimfilters-search-pro.onrender.com/hermes/review' }}
      HERMES_REVIEW_TOKEN_SECRET: ${{ secrets.ADMIN_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Guard against duplicate weekly send
        id: guard
        run: |
          echo "Manual workflow_dispatch run; always proceeds regardless of weekly send state."
          echo "proceed=true" >> "$GITHUB_OUTPUT"

      - name: Restore baseline from hermes-state
        if: steps.guard.outputs.proceed == 'true'
        run: npm run hermes:baseline:restore

      - name: Restore semantic-harvest state from hermes-state
        if: steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        run: npm run hermes:harvest:restore

      - name: Download promotion result (if this dispatch also promoted)
        if: steps.guard.outputs.proceed == 'true' && needs.promote-baseline.result == 'success'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hermes-baseline-promotion
          path: hermes/baselines

      - name: Collect governed known sources
        id: collect
        if: steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        run: npm run hermes:collect

      - name: Persist semantic-harvest state to hermes-state
        if: steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        run: npm run hermes:harvest:persist

      - name: Sweep complete filtration industry with Groq
        id: sweep
        if: steps.guard.outputs.proceed == 'true' && env.HERMES_BASELINE_MODE != 'true'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HERMES_GROQ_MODEL: ${{ vars.HERMES_GROQ_MODEL || 'groq/compound' }}
        run: npm run hermes:sweep

      - name: Generate SEO/GEO/AEO knowledge-gap candidates for HERMES
        id: seo_gaps
        if: steps.guard.outputs.proceed == 'true' && env.HERMES_BASELINE_MODE != 'true'
        continue-on-error: true
        run: |
          python3 scripts/seo-geo-audit/audit.py --out-dir seo-geo-audit-out
          python3 scripts/seo-geo-audit/triage_short_pages.py seo-geo-audit-out/seo-geo-audit.csv --threshold 250 --out-dir seo-geo-audit-out
          python3 scripts/seo-geo-audit/build_hermes_knowledge_gaps.py seo-geo-audit-out/short-pages-triage.csv --out-dir seo-geo-audit-out
          node scripts/hermes/import-seo-knowledge-gaps.mjs seo-geo-audit-out/hermes-knowledge-gaps.json

      - name: Resolve detected source changes and SEO knowledge gaps with Groq
        id: research
        if: steps.guard.outputs.proceed == 'true' && env.HERMES_BASELINE_MODE != 'true'
        continue-on-error: true
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HERMES_GROQ_MODEL: ${{ vars.HERMES_GROQ_MODEL || 'groq/compound' }}
        run: npm run hermes:research

      - name: Validate real candidates
        id: validate
        if: steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        run: npm run hermes:validate:real

      - name: Generate weekly review report
        id: report
        if: always() && steps.guard.outputs.proceed == 'true'
        continue-on-error: true
        env:
          HERMES_COLLECT_STATUS: ${{ steps.collect.outcome || 'skipped' }}
          HERMES_SWEEP_STATUS: ${{ steps.sweep.outcome || 'skipped' }}
          HERMES_SEO_GAPS_STATUS: ${{ steps.seo_gaps.outcome || 'skipped' }}
          HERMES_RESEARCH_STATUS: ${{ steps.research.outcome || 'skipped' }}
          HERMES_VALIDATE_STATUS: ${{ steps.validate.outcome || 'skipped' }}
        run: npm run hermes:report:real

      - name: Ensure a current weekly report exists
        if: always() && steps.guard.outputs.proceed == 'true'
        env:
          HERMES_COLLECT_STATUS: ${{ steps.collect.outcome || 'skipped' }}
          HERMES_SWEEP_STATUS: ${{ steps.sweep.outcome || 'skipped' }}
          HERMES_SEO_GAPS_STATUS: ${{ steps.seo_gaps.outcome || 'skipped' }}
          HERMES_RESEARCH_STATUS: ${{ steps.research.outcome || 'skipped' }}
          HERMES_VALIDATE_STATUS: ${{ steps.validate.outcome || 'skipped' }}
          HERMES_REPORT_STATUS: ${{ steps.report.outcome || 'skipped' }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const date = new Date().toISOString().slice(0, 10);
          const dir = path.resolve('hermes/reports');
          const file = path.join(dir, `hermes-weekly-${date}.md`);
          if (!fs.existsSync(file)) {
            fs.mkdirSync(dir, { recursive: true });
            const statuses = {
              collection: process.env.HERMES_COLLECT_STATUS,
              industry_sweep: process.env.HERMES_SWEEP_STATUS,
              seo_geo_aeo_gap_intake: process.env.HERMES_SEO_GAPS_STATUS,
              research_resolution: process.env.HERMES_RESEARCH_STATUS,
              validation: process.env.HERMES_VALIDATE_STATUS,
              report_generation: process.env.HERMES_REPORT_STATUS,
            };
            const failed = Object.entries(statuses).filter(([, value]) => value === 'failure').map(([key]) => key);
            const body = [
              '# HERMES Weekly Intelligence Review',
              '',
              '**PARTIAL / DEGRADED DELIVERY**',
              '',
              `Generated: ${new Date().toISOString()}`,
              '',
              'HERMES did not suppress the scheduled executive delivery even though one or more upstream stages did not complete.',
              '',
              '## Pipeline status',
              '',
              ...Object.entries(statuses).map(([key, value]) => `- ${key}: ${value}`),
              '',
              failed.length ? `Incomplete stages: ${failed.join(', ')}` : 'No explicit failed stage was recorded; the normal report generator did not produce a current report.',
              '',
              'No incomplete research result is promoted to canonical knowledge or published automatically.',
              '',
              '## Decision authority',
              '',
              'Only Victor Abreu may approve, reject, or request additional research.',
              '',
            ].join('\n');
            fs.writeFileSync(file, body, 'utf8');
            console.log(`[HERMES fallback report] wrote ${file}`);
          } else {
            console.log(`[HERMES fallback report] current report already exists: ${file}`);
          }
          NODE

      - name: Send weekly review email
        id: email
        if: always() && steps.guard.outputs.proceed == 'true'
        env:
          HERMES_EMAIL_PROVIDER: outlook
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          HERMES_SENDER_EMAIL: ${{ secrets.HERMES_SENDER_EMAIL }}
          HERMES_REVIEW_EMAIL: ${{ secrets.HERMES_REVIEW_EMAIL }}
          HERMES_EMAIL_LIVE: ${{ vars.HERMES_EMAIL_LIVE || 'false' }}
        run: npm run hermes:email:real

      - name: Record weekly send for this ISO week
        if: steps.guard.outputs.proceed == 'true' && steps.email.outcome == 'success'
        run: node scripts/hermes/weekly-send-guard.mjs mark

      - name: Upload HERMES artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hermes-weekly-collection
          path: |
            hermes/real-candidates
            hermes/real-candidates-previews
            hermes/reports
            hermes/source-cache
            hermes/baselines
            hermes/industry-sweep
            seo-geo-audit-out
            elimfilters-vault/94-sync-log
          if-no-files-found: warn

      - name: Mark degraded weekly intelligence run as failed
        if: always() && steps.guard.outputs.proceed == 'true' && (steps.collect.outcome == 'failure' || steps.sweep.outcome == 'failure' || steps.seo_gaps.outcome == 'failure' || steps.research.outcome == 'failure' || steps.validate.outcome == 'failure' || steps.report.outcome == 'failure' || steps.email.outcome == 'failure')
        run: |
          echo "HERMES weekly delivery completed or was attempted, but one or more pipeline stages failed. See the emailed partial report and workflow logs."
          exit 1
