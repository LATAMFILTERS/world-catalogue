name: Audit truck carousel image sources
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/audit-truck-carousel-images-20261024.yml
permissions:
  contents: read
jobs:
  image-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Probe exact eight image URLs in current carousel
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,re,hashlib,struct,json
          src=open('frontend/src/components/IndustryFilterCarousel.tsx',encoding='utf-8').read()
          base=re.search(r"const R2_BASE = '([^']+)'",src).group(1)
          block=src.split("  'Trucks Fleets': {",1)[1].split("\n  },",1)[0]
          entries=re.findall(r"'([^']+)': \x60\$\{R2_BASE\}/([^\x60]+)\x60",block)
          for constant,name in [('air-dryer-filters','AIR_DRYER_IMAGE'),('coolant-filters','COOLANT_IMAGE')]:
            line=re.search(rf"const {name} = \x60\$\{{R2_BASE\}}/([^\x60]+)\x60",src)
            if line: entries.append((constant,line.group(1)))
          print('CAROUSEL_EXPECTED',len(entries),flush=True)
          for family,file in entries:
            url=f"{base}/{file}"
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ELIMFILTERS-Carousel-Image-Audit/1.0','Accept':'image/*'})
              with urllib.request.urlopen(req,timeout=18) as r:
                data=r.read(50000000)
                ct=r.headers.get('Content-Type','')
                status=r.status
                final=r.geturl()
              is_png=data[:8]==b'\x89PNG\r\n\x1a\n'
              dimensions=struct.unpack('>II',data[16:24]) if is_png and len(data)>24 else ()
              result=dict(family=family,file=file,status=status,content_type=ct,bytes=len(data),png=is_png,dimensions=dimensions,sha256=hashlib.sha256(data).hexdigest()[:16],redirected=(final!=url))
            except Exception as ex:
              result=dict(family=family,file=file,error=str(ex))
            print('CAROUSEL_AUDIT '+json.dumps(result,ensure_ascii=False),flush=True)
          PY
