services:
  - type: web
    name: elimfilters-instagram-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v18.0
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: DRY_RUN
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: KNOWLEDGE_CENTER_API_URL
        value: "https://knowledge-center-api-staging.onrender.com"
      - key: KNOWLEDGE_CENTER_API_KEY
        sync: false
      - key: KNOWLEDGE_ENGINE_RUNTIME_URL
        value: "https://knowledge-engine-runtime-staging.onrender.com"
      - key: ENGINE_API_KEY
        sync: false
# Blueprint sync status refresh trigger
