services:
  - type: web
    name: elimfilters-knowledge-engine-runtime
    runtime: node
    region: oregon
    plan: starter
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "8086"
      - key: LOG_LEVEL
        value: info
      - key: DEFAULT_AUDIENCE
        value: TECHNICAL_SUPPORT
      - key: MAX_RETRIEVAL_RECORDS
        value: "12"
      - key: MIN_ANSWER_CONFIDENCE
        value: "0.72"
      - key: MIN_PRODUCTION_CONFIDENCE
        value: "0.85"
      - key: ENGINE_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-knowledge-db
          property: connectionString
