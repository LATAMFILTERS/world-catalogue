services:
  - type: web
    name: elimfilters-knowledge-center-api
    runtime: node
    region: oregon
    plan: starter
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: PORT
        value: "3002"
      - key: DATABASE_SSL
        value: "true"
      - key: REQUEST_BODY_LIMIT
        value: 1mb
      - key: KNOWLEDGE_REVIEW_BASE_URL
        value: https://internal.elimfilters.com
      - key: KNOWLEDGE_REVIEW_MAILBOX
        value: support@elimfilters.com
      - key: KNOWLEDGE_API_KEYS
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-knowledge-db
          property: connectionString
