<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELIMFILTERS — Part Search</title>
  <meta name="description" content="Find ELIMFILTERS part numbers, cross-references, and OEM equivalents. Search by SKU, competitor code, or OEM reference.">
  <meta name="robots" content="index, follow">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #FFF12D;
      --bg: #000;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: #fff;
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
    }

    /* ── Canvas ── */
    #nanoflow {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* ── Logo ── */
    #logo {
      position: fixed;
      top: 1.5rem; left: 2rem;
      z-index: 100;
      font-family: 'Outfit', sans-serif;
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
    }
    #logo span { color: var(--yellow); }

    /* ── Skip ── */
    #skip-btn {
      position: fixed;
      bottom: 2rem; right: 2rem;
      z-index: 100;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.25);
      background: transparent;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 2px;
      padding: 0.4rem 0.8rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    #skip-btn:hover {
      color: rgba(255,255,255,0.6);
      border-color: rgba(255,255,255,0.25);
    }

    /* ── UI Layer ── */
    #ui {
      position: relative;
      z-index: 10;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 4vw, 3rem);
    }

    .intro-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--yellow);
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.9s ease, transform 0.9s ease;
      margin-bottom: 2rem;
      text-align: center;
    }
    .intro-label.visible { opacity: 1; transform: translateY(0); }

    /* ── Search ── */
    #search-container {
      width: 100%;
      max-width: 660px;
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 0.6s ease, transform 0.6s ease;
      pointer-events: none;
    }
    #search-container.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .search-wrap {
      position: relative;
      display: flex;
      align-items: center;
      border: 1px solid rgba(255,241,45,0.35);
      border-radius: 3px;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(14px);
      transition: border-color 0.2s;
    }
    .search-wrap:focus-within { border-color: var(--yellow); }

    .search-icon {
      padding: 0 1rem;
      color: rgba(255,255,255,0.35);
      font-size: 1.15rem;
      flex-shrink: 0;
      line-height: 1;
    }

    #search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(0.85rem, 2vw, 1rem);
      padding: 1.1rem 0;
      letter-spacing: 0.04em;
    }
    #search-input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .search-enter {
      padding: 0 1rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.2);
      flex-shrink: 0;
    }

    .search-hint {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      color: rgba(255,255,255,0.22);
      margin-top: 0.8rem;
      letter-spacing: 0.06em;
      text-align: center;
    }

    /* ── Results ── */
    #results {
      width: 100%;
      max-width: 660px;
      margin-top: 1.75rem;
    }

    .result-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.6rem;
      color: rgba(255,255,255,0.35);
      letter-spacing: 0.12em;
      margin-bottom: 1rem;
    }

    .result-card {
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 3px;
      padding: 1.25rem 1.5rem;
      margin-bottom: 0.65rem;
      background: rgba(255,255,255,0.015);
      transition: border-color 0.2s, background 0.2s;
    }
    .result-card:hover {
      border-color: rgba(255,241,45,0.18);
      background: rgba(255,241,45,0.018);
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .result-sku {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.05rem;
      font-weight: 500;
      color: var(--yellow);
      letter-spacing: 0.06em;
    }

    .result-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.56rem;
      letter-spacing: 0.1em;
      padding: 0.2rem 0.5rem;
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 2px;
      color: rgba(255,255,255,0.45);
      text-transform: uppercase;
    }
    .tag.tech {
      border-color: rgba(255,241,45,0.2);
      color: rgba(255,241,45,0.65);
    }

    .result-desc {
      font-size: 0.855rem;
      color: rgba(255,255,255,0.6);
      margin-top: 0.4rem;
      line-height: 1.5;
    }

    .result-specs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 0.6rem;
      margin-top: 0.85rem;
      padding-top: 0.85rem;
      border-top: 1px solid rgba(255,255,255,0.04);
    }

    .spec-item { display: flex; flex-direction: column; gap: 0.2rem; }

    .spec-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.28);
      text-transform: uppercase;
    }

    .spec-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: rgba(255,255,255,0.78);
    }

    .result-refs {
      margin-top: 0.65rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.32);
      line-height: 1.7;
    }

    .status-msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: 2.5rem 0;
      letter-spacing: 0.06em;
    }

    @media (max-width: 480px) {
      .result-specs { grid-template-columns: repeat(2, 1fr); }
      #logo { font-size: 0.7rem; }
    }
  </style>
</head>
<body>

<canvas id="nanoflow"></canvas>

<a href="https://elimfilters.com" id="logo">ELIM<span>FILTERS</span>®</a>

<button id="skip-btn" aria-label="Skip intro">SKIP ›</button>

<div id="ui">
  <p class="intro-label" id="intro-label">// NANOFLOW PART SEARCH — ELIMFILTERS®</p>

  <div id="search-container">
    <div class="search-wrap">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input
        type="search"
        id="search-input"
        placeholder="Part number, OEM code, or competitor reference..."
        autocomplete="off"
        spellcheck="false"
        aria-label="Search parts"
      />
      <span class="search-enter" aria-hidden="true">ENTER</span>
    </div>
    <p class="search-hint">EL82100 &nbsp;·&nbsp; P781466 &nbsp;·&nbsp; LF3874 &nbsp;·&nbsp; BT839 &nbsp;·&nbsp; 1R-0750</p>
  </div>

  <div id="results" role="region" aria-live="polite" aria-label="Search results"></div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// CONFIG — update API_BASE with your Render backend URL
// ─────────────────────────────────────────────────────────────────────────────
const API_BASE = 'https://elimfilters-api.onrender.com';

// ─────────────────────────────────────────────────────────────────────────────
// CANVAS
// ─────────────────────────────────────────────────────────────────────────────
const canvas = document.getElementById('nanoflow');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  W = canvas.width  = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); });

// ─────────────────────────────────────────────────────────────────────────────
// FLOW FIELD — sine-based turbulence
// ─────────────────────────────────────────────────────────────────────────────
function flowAngle(x, y, t) {
  const nx = x / W, ny = y / H;
  return (
    Math.sin(nx * 3.2 + t * 0.38) * Math.cos(ny * 2.1 + t * 0.29) +
    Math.sin(nx * 1.4 - t * 0.22) * Math.sin(ny * 2.8 + t * 0.51)
  ) * Math.PI;
}

// ─────────────────────────────────────────────────────────────────────────────
// FILTER SILHOUETTE — spin-on oil filter drawn on offscreen canvas
// ─────────────────────────────────────────────────────────────────────────────
function buildFilterSilhouette(cx, cy) {
  const OW = 180, OH = 300;
  const off = document.createElement('canvas');
  off.width = OW; off.height = OH;
  const oc = off.getContext('2d');

  const bx = 35, by = 28, bw = 110, bh = 200;
  const midX = bx + bw / 2;

  oc.fillStyle = '#fff';

  // Body
  oc.beginPath();
  oc.moveTo(bx + 10, by);
  oc.lineTo(bx + bw - 10, by);
  oc.quadraticCurveTo(bx + bw, by, bx + bw, by + 10);
  oc.lineTo(bx + bw, by + bh);
  oc.lineTo(bx, by + bh);
  oc.lineTo(bx, by + 10);
  oc.quadraticCurveTo(bx, by, bx + 10, by);
  oc.closePath();
  oc.fill();

  // Top dome
  oc.beginPath();
  oc.ellipse(midX, by + 6, bw / 2 - 1, 24, 0, Math.PI, 0, true);
  oc.fill();

  // Neck
  oc.beginPath();
  oc.rect(bx + 20, by + bh - 4, bw - 40, 20);
  oc.fill();

  // Thread base
  oc.beginPath();
  oc.rect(bx + 26, by + bh + 14, bw - 52, 22);
  oc.fill();

  // Center bore (negative)
  oc.fillStyle = '#000';
  oc.beginPath();
  oc.arc(midX, by + bh + 25, 9, 0, Math.PI * 2);
  oc.fill();

  // Bolt holes (negative)
  [-20, -12, 12, 20].forEach(dx => {
    oc.beginPath();
    oc.arc(midX + dx, by + bh + 25, 3.5, 0, Math.PI * 2);
    oc.fill();
  });

  // Sample white pixels → particle targets
  const img = oc.getImageData(0, 0, OW, OH).data;
  const pts = [];
  const step = 3;
  for (let y = 0; y < OH; y += step) {
    for (let x = 0; x < OW; x += step) {
      const i = (y * OW + x) * 4;
      if (img[i] > 120 && img[i + 3] > 128) {
        pts.push({
          x: cx + (x - OW / 2) * 2.1,
          y: cy + (y - OH / 2) * 2.1,
        });
      }
    }
  }
  return pts;
}

// ─────────────────────────────────────────────────────────────────────────────
// PARTICLE
// ─────────────────────────────────────────────────────────────────────────────
class Particle {
  constructor() {
    this.x  = Math.random() * W;
    this.y  = Math.random() * H;
    this.vx = (Math.random() - 0.5) * 1.8;
    this.vy = (Math.random() - 0.5) * 1.8;
    this.tx = this.x;
    this.ty = this.y;
    this.size   = Math.random() * 1.3 + 0.4;
    this.alpha  = Math.random() * 0.5 + 0.2;
    this.speed  = 0.022 + Math.random() * 0.018;
  }

  scatter(t) {
    const a  = flowAngle(this.x, this.y, t);
    this.vx += Math.cos(a) * 0.13;
    this.vy += Math.sin(a) * 0.13;
    this.vx *= 0.91;
    this.vy *= 0.91;
    this.x  += this.vx;
    this.y  += this.vy;
    if (this.x < -8) this.x = W + 8;
    if (this.x > W + 8) this.x = -8;
    if (this.y < -8) this.y = H + 8;
    if (this.y > H + 8) this.y = -8;
  }

  converge() {
    this.vx = this.vx * 0.78 + (this.tx - this.x) * this.speed;
    this.vy = this.vy * 0.78 + (this.ty - this.y) * this.speed;
    this.x += this.vx;
    this.y += this.vy;
  }

  draw(a) {
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${a !== undefined ? a : this.alpha})`;
    ctx.fill();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// ANIMATION STATE MACHINE
// ─────────────────────────────────────────────────────────────────────────────
const N = 2000;
let particles  = [];
let phase      = 'scatter';
let phaseStart = 0;
let tick       = 0;
let rafId;

// phase durations (ms)
const DUR = {
  scatter:         1300,
  'converge-filter': 1700,
  hold:            1100,
  'converge-search': 1000,
};

function init() {
  particles = Array.from({ length: N }, () => new Particle());
}

function assignTargets(pts) {
  particles.forEach((p, i) => {
    const fp = pts[i % pts.length];
    p.tx = fp.x + (Math.random() - 0.5) * 1.5;
    p.ty = fp.y + (Math.random() - 0.5) * 1.5;
  });
}

function searchBarTargets() {
  const bw = Math.min(640, W * 0.85);
  const bh = 56;
  const bx = W / 2 - bw / 2;
  const by = H / 2 - bh / 2;
  return particles.map(() => {
    const r = Math.random();
    if      (r < 0.32) return { x: bx + Math.random() * bw, y: by + Math.random() * 1.5 };
    else if (r < 0.64) return { x: bx + Math.random() * bw, y: by + bh - Math.random() * 1.5 };
    else if (r < 0.82) return { x: bx + Math.random() * 1.5, y: by + Math.random() * bh };
    else               return { x: bx + bw - Math.random() * 1.5, y: by + Math.random() * bh };
  });
}

function revealUI() {
  document.getElementById('search-container').classList.add('visible');
  document.getElementById('skip-btn').style.display = 'none';
  setTimeout(() => document.getElementById('search-input').focus(), 350);
  localStorage.setItem('ef-ps-seen', '1');
}

function ambientLoop() {
  const amb = Array.from({ length: 350 }, () => new Particle());
  (function loop() {
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(0, 0, W, H);
    tick += 0.004;
    amb.forEach(p => { p.scatter(tick); p.draw(p.alpha * 0.35); });
    rafId = requestAnimationFrame(loop);
  })();
}

function mainLoop(now) {
  if (!phaseStart) phaseStart = now;
  const elapsed = now - phaseStart;

  // motion-blur trail
  ctx.fillStyle = 'rgba(0,0,0,0.13)';
  ctx.fillRect(0, 0, W, H);
  tick += 0.005;

  switch (phase) {
    case 'scatter':
      particles.forEach(p => { p.scatter(tick); p.draw(); });
      if (elapsed > DUR.scatter) {
        phase = 'converge-filter';
        phaseStart = now;
        const fp = buildFilterSilhouette(W / 2, H / 2 - 20);
        assignTargets(fp);
      }
      break;

    case 'converge-filter':
      particles.forEach(p => { p.converge(); p.draw(); });
      if (elapsed > DUR['converge-filter']) {
        phase = 'hold';
        phaseStart = now;
      }
      break;

    case 'hold':
      particles.forEach(p => {
        p.tx += (Math.random() - 0.5) * 0.25;
        p.ty += (Math.random() - 0.5) * 0.25;
        p.converge();
        p.draw();
      });
      if (elapsed > DUR.hold) {
        phase = 'converge-search';
        phaseStart = now;
        const sp = searchBarTargets();
        particles.forEach((p, i) => { p.tx = sp[i].x; p.ty = sp[i].y; });
      }
      break;

    case 'converge-search':
      particles.forEach(p => { p.converge(); p.draw(); });
      if (elapsed > DUR['converge-search']) {
        cancelAnimationFrame(rafId);
        revealUI();
        ambientLoop();
        return;
      }
      break;
  }

  rafId = requestAnimationFrame(mainLoop);
}

// ─────────────────────────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────────────────────────
if (localStorage.getItem('ef-ps-seen')) {
  // Returning user — skip directly to search
  document.getElementById('intro-label').classList.add('visible');
  document.getElementById('skip-btn').style.display = 'none';
  revealUI();
  ambientLoop();
} else {
  init();
  setTimeout(() => document.getElementById('intro-label').classList.add('visible'), 500);
  requestAnimationFrame(mainLoop);
  document.getElementById('skip-btn').addEventListener('click', () => {
    cancelAnimationFrame(rafId);
    ctx.clearRect(0, 0, W, H);
    document.getElementById('intro-label').classList.add('visible');
    revealUI();
    ambientLoop();
  });
}

// ─────────────────────────────────────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────────────────────────────────────
const input     = document.getElementById('search-input');
const resultsEl = document.getElementById('results');
let debounce;

function fmtRefs(arr, limit = 6) {
  if (!arr || !arr.length) return null;
  return arr.slice(0, limit).join(' · ');
}

function renderCard(p) {
  const sku   = p.elimfilters_sku || p.sku || '—';
  const specs = [];

  if (p.height_mm)          specs.push(['HEIGHT', p.height_mm + ' mm']);
  if (p.outer_diameter_mm)  specs.push(['OD', p.outer_diameter_mm + ' mm']);
  if (p.thread_size)        specs.push(['THREAD', p.thread_size]);
  if (p.micron_rating)      specs.push(['MICRON', p.micron_rating + ' µm']);
  if (p.burst_pressure_psi) specs.push(['BURST', p.burst_pressure_psi + ' psi']);
  if (p.iso_test_method)    specs.push(['ISO METHOD', p.iso_test_method]);
  if (p.nominal_efficiency) specs.push(['EFFICIENCY', p.nominal_efficiency + '%']);

  const oem  = fmtRefs(p.oem_codes);
  const comp = fmtRefs(p.competitor_codes);

  return `
    <div class="result-card">
      <div class="card-header">
        <span class="result-sku">${sku}</span>
        <div class="result-tags">
          ${p.filter_type    ? `<span class="tag">${p.filter_type}</span>`    : ''}
          ${p.duty           ? `<span class="tag">${p.duty}</span>`           : ''}
          ${p.technology     ? `<span class="tag tech">${p.technology}</span>`: ''}
          ${p.installation_type ? `<span class="tag">${p.installation_type}</span>` : ''}
        </div>
      </div>
      ${p.description ? `<p class="result-desc">${p.description}</p>` : ''}
      ${specs.length ? `
        <div class="result-specs">
          ${specs.map(([l, v]) => `
            <div class="spec-item">
              <span class="spec-label">${l}</span>
              <span class="spec-value">${v}</span>
            </div>`).join('')}
        </div>` : ''}
      ${oem  ? `<p class="result-refs">OEM — ${oem}</p>`  : ''}
      ${comp ? `<p class="result-refs">CROSS — ${comp}</p>` : ''}
    </div>`;
}

async function runSearch(q) {
  if (q.length < 2) { resultsEl.innerHTML = ''; return; }
  resultsEl.innerHTML = '<p class="status-msg">// SEARCHING...</p>';
  try {
    const r = await fetch(`${API_BASE}/api/search?q=${encodeURIComponent(q)}`);
    if (!r.ok) throw new Error('API error ' + r.status);
    const data = await r.json();
    if (!data.products?.length) {
      resultsEl.innerHTML = '<p class="status-msg">// NO RESULTS — try a different reference</p>';
      return;
    }
    resultsEl.innerHTML =
      `<p class="result-count">// ${data.count} RESULT${data.count !== 1 ? 'S' : ''} — "${q.toUpperCase()}"</p>` +
      data.products.map(renderCard).join('');
  } catch (e) {
    resultsEl.innerHTML = '<p class="status-msg">// CONNECTION ERROR — verify API endpoint</p>';
  }
}

input.addEventListener('input', () => {
  clearTimeout(debounce);
  const q = input.value.trim();
  if (q.length < 2) { resultsEl.innerHTML = ''; return; }
  debounce = setTimeout(() => runSearch(q), 300);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') { clearTimeout(debounce); runSearch(input.value.trim()); }
});
</script>

</body>
</html>
