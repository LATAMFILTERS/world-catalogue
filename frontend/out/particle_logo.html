<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Particle Logo Animation</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #000;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      color: #fff;
      font-family: 'Outfit', sans-serif;
    }
    canvas {
      display: block;
    }
    #controls {
      position: absolute;
      bottom: 30px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }
    .hint {
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      opacity: 0.5;
      text-transform: uppercase;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>
  <div id="controls">
    <div class="hint">Mueve el ratón sobre el logo para dispersar la arena</div>
  </div>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    
    let particlesArray = [];
    let isImageLoaded = false;
    
    // Configuración
    const particleSpacing = 4; // Menos = más resolución pero más pesado
    const mouseRadius = 60;
    
    let mouse = {
      x: null,
      y: null,
      radius: mouseRadius
    }
    
    window.addEventListener('mousemove', function(event) {
      mouse.x = event.x;
      mouse.y = event.y;
    });
    
    window.addEventListener('mouseout', function() {
      mouse.x = undefined;
      mouse.y = undefined;
    });

    // Redimensionar canvas
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Imagen
    const image = new Image();
    // Reemplaza esta ruta con la ruta real a tu imagen del logo E
    image.src = '/e.png'; // Usando el logo actual de KLEO como placeholder mientras subimos la imagen 'E'
    
    image.addEventListener('load', function() {
      init();
      isImageLoaded = true;
      animate();
    });

    class Particle {
      constructor(x, y, color) {
        this.x = Math.random() * canvas.width; // Empieza en posición aleatoria (efecto viento)
        this.y = Math.random() * canvas.height;
        this.baseX = x;
        this.baseY = y;
        this.color = color;
        this.size = 1.5;
        this.density = (Math.random() * 30) + 1; // Peso de la partícula
      }
      
      draw() {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.closePath();
        ctx.fill();
      }
      
      update() {
        // Interacción con el ratón (Dispersar)
        let dx = mouse.x - this.x;
        let dy = mouse.y - this.y;
        let distance = Math.sqrt(dx * dx + dy * dy);
        
        // Fuerzas de retorno a la posición base
        let forceDirectionX = dx / distance;
        let forceDirectionY = dy / distance;
        let maxDistance = mouse.radius;
        let force = (maxDistance - distance) / maxDistance;
        let directionX = forceDirectionX * force * this.density;
        let directionY = forceDirectionY * force * this.density;
        
        if (distance < mouse.radius) {
          this.x -= directionX;
          this.y -= directionY;
        } else {
          // Regresar a la forma original si no hay ratón cerca
          if (this.x !== this.baseX) {
            let dx = this.x - this.baseX;
            this.x -= dx / 15; // Velocidad de retorno
          }
          if (this.y !== this.baseY) {
            let dy = this.y - this.baseY;
            this.y -= dy / 15;
          }
        }
      }
    }

    function init() {
      particlesArray = [];
      
      // Calcular posición centrada
      const imgWidth = Math.min(image.width, canvas.width * 0.5);
      const scale = imgWidth / image.width;
      const imgHeight = image.height * scale;
      
      const startX = (canvas.width - imgWidth) / 2;
      const startY = (canvas.height - imgHeight) / 2;

      ctx.drawImage(image, startX, startY, imgWidth, imgHeight);
      
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const data = imageData.data;
      
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (let y = 0, y2 = imageData.height; y < y2; y += particleSpacing) {
        for (let x = 0, x2 = imageData.width; x < x2; x += particleSpacing) {
          const index = (y * imageData.width + x) * 4;
          const alpha = data[index + 3];
          
          if (alpha > 128) { // Si el pixel no es transparente
            const red = data[index];
            const green = data[index + 1];
            const blue = data[index + 2];
            const color = `rgb(${red}, ${green}, ${blue})`;
            
            particlesArray.push(new Particle(x, y, color));
          }
        }
      }
    }

    function animate() {
      requestAnimationFrame(animate);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.2)'; // Efecto estela
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      for (let i = 0; i < particlesArray.length; i++) {
        particlesArray[i].draw();
        particlesArray[i].update();
      }
    }
  </script>
</body>
</html>
