services:
  - type: web
    name: elimfilters-whatsapp-bot
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v18.0
      - key: WHATSAPP_BUSINESS_ACCOUNT_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-super-120b-a12b
      - key: DRY_RUN
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: elimfilters-instagram-db
          property: connectionString
      - key: NVIDIA_NIM_API_KEY
        sync: false
# Blueprint sync status refresh trigger
