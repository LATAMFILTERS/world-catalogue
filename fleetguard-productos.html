            padding: 0;

            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

        }

        }

        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-box {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            color: white;
            backdrop-filter: blur(10px);
        }

        .stat-box h3 {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .stat-box p {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            animation: fadeIn 0.8s ease;
        }

        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }

        .product-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-bottom: 3px solid #667eea;
        }

        .product-index {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .product-sku {
            font-size: 1.8em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 5px;
        }

        .product-type {
            font-size: 0.95em;
            opacity: 0.95;
        }

        .product-body {
            padding: 20px;
        }

        .product-description {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
            font-size: 0.95em;
        }

        .product-footer {
            border-top: 1px solid #eee;
            padding-top: 15px;
            margin-top: 15px;
        }

        .related-label {
            font-weight: bold;
            color: #667eea;
            font-size: 0.85em;
            margin-bottom: 8px;
            display: block;
        }

        .related-products {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .related-badge {
            background: #f0f4ff;
            border: 1px solid #667eea;
            color: #667eea;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: 500;
        }

        .no-related {
            color: #999;
            font-size: 0.9em;
            font-style: italic;
        }

        .product-url {
            font-size: 0.8em;
            color: #999;
            word-break: break-all;
            margin-top: 10px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .filters {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            backdrop-filter: blur(10px);
        }

        .filter-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.4);
            color: white;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: white;
            color: #667eea;
            border-color: white;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 40px;
            padding: 20px;
            opacity: 0.8;
        }
    </style>
</head>

        function renderProducts(productsToShow = products) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            productsToShow.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.setAttribute('data-type', product.name);

                const relatedHTML = Object.keys(product.relatedProducts).length > 0
                    ? Object.entries(product.relatedProducts)
                        .map(([sku, type]) => `<div class="related-badge">${sku}</div>`)
                        .join('')
                    : '<div class="no-related">Sin productos relacionados</div>';

                card.innerHTML = `
                    <div class="product-header">
                        <div class="product-index">#${product.index}</div>
                        <div class="product-sku">${product.sku}</div>
                        <div class="product-type">${product.name}</div>
                    </div>
                    <div class="product-body">
                        <div class="product-description">${product.description}</div>
                        <div class="product-footer">
                            <label class="related-label">Productos Relacionados:</label>
                            <div class="related-products">${relatedHTML}</div>
                        </div>
                        <div class="product-url">📌 ${product.sourceUrl}</div>
                    </div>
                `;

                grid.appendChild(card);
            });
        }

        function filterProducts(type) {
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter products
            if (type === 'all') {
                renderProducts(products);
            } else {
                const filtered = products.filter(p => p.name.includes(type));
                renderProducts(filtered);
            }
        }

        // Initial render
        renderProducts();
