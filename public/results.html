<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ELIMFILTERS — DURATECH™ Integrated Kits</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --y: #FFF12D;
      --y-glow: rgba(255, 241, 45, 0.4);
      --bg: #050505;
      --card-bg: rgba(255, 255, 255, 0.015);
      --card-hover-bg: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.06);
      --border-hover: rgba(255, 241, 45, 0.25);
      --muted: rgba(255, 255, 255, 0.4);
      --text: #f5f5f7;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    /* Background Nano Flow Canvas */
    #nanoflow {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      z-index: -1; pointer-events: none; opacity: 0.15;
    }

    /* Navbar */
    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 2.5rem;
      border-bottom: 1px solid var(--border);
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(15px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo-text {
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      letter-spacing: 0.25em;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }
    .logo-text img { height: 36px; }
    .back-btn {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 500;
      color: var(--y);
      text-decoration: none;
      border: 1px solid rgba(255,241,45,0.25);
      padding: 0.4rem 1rem;
      border-radius: 3px;
      transition: all 0.2s ease;
      letter-spacing: 0.05em;
    }
    .back-btn:hover {
      background: rgba(255,241,45,0.1);
      box-shadow: 0 0 15px var(--y-glow);
      border-color: var(--y);
    }

    /* Layout */
    .layout {
      flex: 1;
      padding: 2.5rem 1.5rem;
      max-width: 960px;
      margin: 0 auto;
      width: 100%;
    }

    .results-panel {
      width: 100%;
    }

    .status-msg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.3);
      padding: 5rem 0;
      text-align: center;
      letter-spacing: 0.1em;
    }

    /* ── DURATECH KIT INTERFACE ── */
    .kit-header {
      border: 1px solid rgba(255, 241, 45, 0.2);
      border-radius: 8px;
      padding: 2rem;
      background: linear-gradient(135deg, rgba(255, 241, 45, 0.02) 0%, rgba(255, 255, 255, 0.005) 100%);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      margin-bottom: 2.5rem;
      position: relative;
      overflow: hidden;
    }
    .kit-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 4px; height: 100%;
      background: var(--y);
    }
    .kit-badge-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .kit-brand-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      color: var(--y);
      font-weight: 700;
    }
    .kit-code-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #000;
      background: var(--y);
      padding: 0.4rem 1.2rem;
      border-radius: 4px;
      box-shadow: 0 0 20px var(--y-glow);
    }
    .kit-meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 1.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .meta-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.55rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.15em;
    }
    .meta-val {
      font-size: 0.95rem;
      font-weight: 600;
      color: #fff;
    }
    .meta-val.vin-code {
      font-family: 'JetBrains Mono', monospace;
      color: var(--y);
      text-shadow: 0 0 8px rgba(255, 241, 45, 0.3);
      font-size: 1rem;
    }

    /* Kit Components Title */
    .section-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .components-count {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
      letter-spacing: 0.1em;
    }

    /* Grid of Filter Cards */
    .components-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .component-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--card-bg);
      padding: 1.5rem 1.75rem;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }
    .component-card:hover {
      border-color: var(--border-hover);
      background: var(--card-hover-bg);
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .card-title-block {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }
    .card-sku-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--y);
      text-decoration: none;
      letter-spacing: 0.05em;
      transition: color 0.15s;
    }
    .card-sku-link:hover {
      color: #fff;
    }
    .card-type-desc {
      font-size: 0.85rem;
      color: var(--muted);
    }
    .card-badges {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }
    .badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.52rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      padding: 0.22rem 0.6rem;
      border: 1px solid var(--border);
      border-radius: 2px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .badge.tech {
      border-color: rgba(255, 241, 45, 0.3);
      color: var(--y);
      background: rgba(255, 241, 45, 0.03);
    }
    .badge.duty {
      border-color: rgba(255, 255, 255, 0.15);
      color: #fff;
    }
    .badge.install {
      border-color: rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6);
    }

    /* Specs Area */
    .card-specs {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 1rem;
      margin-top: 1.25rem;
      padding: 1rem 0;
      border-top: 1px solid rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.03);
    }
    .spec-item {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }
    .spec-lbl {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.5rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }
    .spec-val {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.85);
    }

    /* References Expandable list */
    .card-refs-toggle {
      margin-top: 0.75rem;
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      letter-spacing: 0.05em;
    }
    .card-refs-toggle:hover {
      color: #fff;
    }
    .refs-list {
      display: none;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 0.5rem;
      margin-top: 0.75rem;
      padding: 0.8rem;
      background: rgba(255, 255, 255, 0.005);
      border: 1px dashed rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    .refs-list.open {
      display: grid;
    }
    .ref-entry {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: rgba(255,255,255,0.35);
    }
    .ref-brand {
      color: rgba(255, 255, 255, 0.6);
      font-weight: 500;
      margin-right: 0.3rem;
    }

    /* ── FLOATING AI WIDGET ── */
    #ai-widget {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 0.6rem;
    }

    /* Toggle button */
    #ai-toggle {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #0a0a0a;
      border: 1px solid rgba(255,241,45,0.3);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
      position: relative;
    }
    #ai-toggle:hover {
      border-color: var(--y);
      box-shadow: 0 0 18px var(--y-glow);
      transform: scale(1.05);
    }
    #ai-toggle img { width: 26px; height: 26px; object-fit: contain; }
    #ai-toggle .pulse {
      width: 8px; height: 8px;
      background: var(--y);
      border-radius: 50%;
      position: absolute;
      top: 4px; right: 4px;
      box-shadow: 0 0 8px var(--y);
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

    /* Chat drawer */
    #ai-drawer {
      width: 320px;
      height: 480px;
      background: rgba(10,10,10,0.97);
      border: 1px solid rgba(255,241,45,0.2);
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 50px rgba(0,0,0,0.9);
      backdrop-filter: blur(25px);
      transform-origin: bottom right;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.22s ease;
      transform: scale(0.92) translate(10px, 10px);
      opacity: 0;
      pointer-events: none;
    }
    #ai-drawer.open {
      transform: scale(1) translate(0, 0);
      opacity: 1;
      pointer-events: all;
    }

    /* Drawer header */
    .ai-header {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: rgba(15,15,15,0.95);
    }
    .ai-header img.e-logo {
      width: 20px;
      height: 20px;
      object-fit: contain;
    }
    .ai-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.58rem;
      letter-spacing: 0.15em;
      color: var(--y);
      font-weight: 700;
      flex: 1;
    }
    .ai-dot {
      width: 6px; height: 6px;
      background: var(--y);
      border-radius: 50%;
      box-shadow: 0 0 6px var(--y);
      animation: blink 2s infinite;
    }

    /* Chat messages */
    .ai-chat {
      flex: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
    }
    .msg {
      max-width: 88%;
      font-size: 0.78rem;
      line-height: 1.55;
      padding: 0.65rem 0.85rem;
      border-radius: 6px;
    }
    .msg.user {
      background: #1c1c1e;
      align-self: flex-end;
      border: 1px solid rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.9);
    }
    .msg.ai {
      background: rgba(255, 241, 45, 0.02);
      align-self: flex-start;
      border: 1px solid rgba(255, 241, 45, 0.08);
      color: rgba(255,255,255,0.9);
    }
    .msg.ai .ai-signature {
      display: block;
      margin-top: 0.5rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.45rem;
      color: rgba(255,241,45,0.4);
      letter-spacing: 0.1em;
    }

    /* Input area */
    .ai-input-area {
      padding: 0.75rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      background: rgba(12,12,12,0.95);
      display: flex;
      gap: 0.5rem;
    }
    .ai-input {
      flex: 1;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 4px;
      color: #fff;
      padding: 0.55rem 0.75rem;
      font-family: 'Outfit', sans-serif;
      font-size: 0.8rem;
      outline: none;
      min-width: 0;
    }
    .ai-input:focus { border-color: rgba(255,241,45,0.3); }
    .ai-btn {
      background: var(--y);
      border: none;
      color: #000;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      font-weight: 700;
      padding: 0 1rem;
      border-radius: 4px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }
    .ai-btn:hover { background: #ffe800; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

  <canvas id="nanoflow"></canvas>

  <nav class="navbar">
    <a href="/" class="logo-text">
      <img src="https://elimfilters.com/images/logo-sin-fondo.avif" alt="ELIMFILTERS">
      <span>PART SEARCH</span>
    </a>
    <a href="/" class="back-btn">← NEW SEARCH</a>
  </nav>

  <div class="layout">
    <main class="results-panel" id="results-container">
      <div class="status-msg" id="loading-indicator">// ANALYZING METROLOGY SYSTEM DATA...</div>
    </main>
  </div>

  <!-- ── FLOATING AI WIDGET ── -->
  <div id="ai-widget">
    <div id="ai-drawer">
      <div class="ai-header">
        <img class="e-logo" src="https://elimfilters.com/images/logo-sin-fondo.avif" alt="ELIMFILTERS">
        <span class="ai-title">ASSET PROTECTION AI</span>
        <span class="ai-dot"></span>
      </div>
      <div class="ai-chat" id="chat-window">
        <div class="msg ai">
          Sistema activo. Soy el Ingeniero de Confiabilidad ELIMFILTERS. Consulta sobre TCO, agua en combustible, Ratio Beta o contaminación.
          <span class="ai-signature">ELIMFILTERS AI · TERMINAL V3.9</span>
        </div>
      </div>
      <div class="ai-input-area">
        <input type="text" id="ai-input" class="ai-input" placeholder="Consulta técnica..." autocomplete="off">
        <button id="ai-btn" class="ai-btn">↑</button>
      </div>
    </div>
    <button id="ai-toggle" aria-label="Toggle AI">
      <span class="pulse"></span>
      <img src="https://elimfilters.com/images/logo-sin-fondo.avif" style="width: 24px; height: 24px;" alt="AI">
    </button>
  </div>

  <script>
    // ─── CANVAS ambient background (nano flow) ──────────────────────────────
    const canvas = document.getElementById('nanoflow');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const particles = [];
    for(let i=0; i<35; i++) {
      particles.push({
        x: Math.random() * window.innerWidth,
        y: Math.random() * window.innerHeight,
        vx: (Math.random() - 0.5) * 0.25,
        vy: (Math.random() - 0.5) * 0.25,
        r: Math.random() * 1.5 + 0.5
      });
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = 'rgba(255, 241, 45, 0.2)';
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if(p.x < 0 || p.x > W) p.vx *= -1;
        if(p.y < 0 || p.y > H) p.vy *= -1;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
        ctx.fill();
      });
      requestAnimationFrame(draw);
    }
    draw();

    // ─── SEARCH & RENDER LOGIC ──────────────────────────────────────────────
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode') || 'part';
    const q = urlParams.get('q');
    const model = urlParams.get('model');
    const type = urlParams.get('type');
    const engine = urlParams.get('engine');
    const vin = urlParams.get('vin');
    const year = urlParams.get('year');

    const resultsContainer = document.getElementById('results-container');
    const chatWindow = document.getElementById('chat-window');
    const aiInput = document.getElementById('ai-input');
    const aiBtn = document.getElementById('ai-btn');

    let currentContext = { searchedPart: q, model: model, equipment: type, vin: vin, engine: engine, year: year };

    // Deterministic Hash code for persistent Kit codes
    function getKitCode(duty, salt) {
      let hash = 0;
      const str = (salt || 'ELIM').toUpperCase();
      for (let i = 0; i < str.length; i++) {
        hash = str.charCodeAt(i) + ((hash << 5) - hash);
      }
      const digits = Math.abs(hash) % 9000 + 1000; // 4-digit number
      const prefix = duty === 'HEAVY_DUTY' ? 'EK5' : 'EK3';
      return `${prefix}${digits}`;
    }

    async function executeSearch() {
      try {
        let url = '';
        if (mode === 'part' && q) {
          url = `/api/search?q=${encodeURIComponent(q)}`;
        } else if (mode === 'vin' && model) {
          url = `/api/search/vin?model=${encodeURIComponent(model)}${engine ? '&engine='+encodeURIComponent(engine) : ''}${year ? '&year='+encodeURIComponent(year) : ''}`;
        } else if (mode === 'equip' && model) {
          url = `/api/search/equipment?model=${encodeURIComponent(model)}${type ? '&type='+encodeURIComponent(type) : ''}${engine ? '&engine='+encodeURIComponent(engine) : ''}`;
        }

        if (!url) {
          resultsContainer.innerHTML = '<div class="status-msg">// INVALID SEARCH PARAMETERS</div>';
          return;
        }

        const res = await fetch(url);
        const data = await res.json();
        
        const items = data.products || data.filters || [];
        renderResults(items);
        
        if (items.length > 0) {
          const sku = items[0].elimfilters_sku || items[0].sku;
          currentContext.primaryResult = sku;
        }
      } catch (err) {
        console.error(err);
        resultsContainer.innerHTML = '<div class="status-msg">// ERROR FETCHING CATALOG DATA</div>';
      }
    }

    function renderResults(items) {
      if (!items || items.length === 0) {
        resultsContainer.innerHTML = '<div class="status-msg">// NO ASSETS FOUND MATCHING PARAMETERS</div>';
        return;
      }

      // Check duty based on returned items (default to LIGHT_DUTY if not found, or HEAVY_DUTY if mode is equip)
      let duty = 'LIGHT_DUTY';
      if (mode === 'equip') {
        duty = 'HEAVY_DUTY';
      } else {
        const foundHD = items.some(item => item.duty === 'HEAVY_DUTY');
        if (foundHD) duty = 'HEAVY_DUTY';
      }

      // Auto-extract vehicle or equipment details from matching applications if not fully present in URL
      let displayModel = model || '';
      let displayMake = '';
      let displayEngine = engine || '';
      let displayYear = year || '';
      let displayType = type || '';

      const queryUpper = (model || q || '').toUpperCase().trim();

      if (duty === 'HEAVY_DUTY') {
        // Look for matching equipment application in the returned items
        for (const item of items) {
          const apps = item.equipment_applications || item.vehicle_applications || [];
          const found = apps.find(app => {
            const m = (app.model || app.machine || '').toUpperCase();
            const mk = (app.make || '').toUpperCase();
            return m.includes(queryUpper) || `${mk} ${m}`.includes(queryUpper) || queryUpper.includes(m);
          });
          if (found) {
            displayMake = found.make || '';
            displayModel = found.model || found.machine || displayModel;
            displayEngine = found.engine || found.engine_code || displayEngine;
            displayType = found.type || displayType;
            break;
          }
        }
        if (displayMake && !displayModel.toUpperCase().includes(displayMake.toUpperCase())) {
          displayModel = `${displayMake} ${displayModel}`;
        }
      } else {
        // Light Duty: Look for matching vehicle application
        for (const item of items) {
          const apps = item.vehicle_applications || item.equipment_applications || [];
          const found = apps.find(app => {
            const m = (app.model || app.machine || '').toUpperCase();
            const mk = (app.make || '').toUpperCase();
            return m.includes(queryUpper) || `${mk} ${m}`.includes(queryUpper) || queryUpper.includes(m);
          });
          if (found) {
            displayMake = found.make || '';
            displayModel = found.model || found.machine || displayModel;
            displayEngine = found.engine_code || found.engine || displayEngine;
            displayYear = found.year_range || displayYear;
            break;
          }
        }
        if (displayMake && !displayModel.toUpperCase().includes(displayMake.toUpperCase())) {
          displayModel = `${displayMake} ${displayModel}`;
        }
      }

      // Generate a persistent Kit code based on the search parameters
      const salt = displayModel || model || q || 'DURATECH';
      const kitCode = getKitCode(duty, salt);
      currentContext.kitCode = kitCode;

      // 1. Render Kit Header card
      let headerHtml = '';
      if (duty === 'LIGHT_DUTY') {
        headerHtml = `
          <div class="kit-header">
            <div class="kit-badge-row">
              <div class="kit-brand-title">DURATECH™ INTEGRATED PROTECTION KIT</div>
              <div class="kit-code-badge">${kitCode}</div>
            </div>
            <div class="kit-meta-grid">
              ${vin ? `
                <div class="meta-item">
                  <div class="meta-lbl">VIN / SERIAL</div>
                  <div class="meta-val vin-code">${vin.toUpperCase()}</div>
                </div>
              ` : ''}
              <div class="meta-item">
                <div class="meta-lbl">VEHICLE MAKE & MODEL</div>
                <div class="meta-val">${(displayModel || 'VEHICULO NO ESPECIFICADO').toUpperCase()}</div>
              </div>
              ${displayYear ? `
                <div class="meta-item">
                  <div class="meta-lbl">MANUFACTURE YEAR</div>
                  <div class="meta-val">${displayYear}</div>
                </div>
              ` : ''}
              <div class="meta-item">
                <div class="meta-lbl">ENGINE TYPE</div>
                <div class="meta-val">${(displayEngine || 'N/A').toUpperCase()}</div>
              </div>
            </div>
          </div>
        `;
      } else {
        // Heavy Duty Kit Header
        headerHtml = `
          <div class="kit-header" style="border-color: rgba(255, 241, 45, 0.45);">
            <div class="kit-badge-row">
              <div class="kit-brand-title">DURATECH™ HEAVY DUTY SYSTEM KIT</div>
              <div class="kit-code-badge">${kitCode}</div>
            </div>
            <div class="kit-meta-grid">
              <div class="meta-item">
                <div class="meta-lbl">EQUIPMENT MODEL</div>
                <div class="meta-val">${(displayModel || 'HEAVY MACHINERY').toUpperCase()}</div>
              </div>
              <div class="meta-item">
                <div class="meta-lbl">EQUIPMENT TYPE</div>
                <div class="meta-val">${(displayType || type || 'INDUSTRIAL CLASS').toUpperCase()}</div>
              </div>
              <div class="meta-item">
                <div class="meta-lbl">POWERPLANT ENGINE</div>
                <div class="meta-val">${(displayEngine || 'N/A').toUpperCase()}</div>
              </div>
            </div>
          </div>
        `;
      }

      // 2. Render components list
      let componentsHtml = `
        <div class="section-title-row">
          <div class="section-title">Kitted Filtration Components</div>
          <div class="components-count">${items.length} COMPONENT${items.length !== 1 ? 'S' : ''}</div>
        </div>
        <div class="components-grid">
      `;

      componentsHtml += items.map((p, idx) => {
        const sku = p.elimfilters_sku || p.sku;
        
        // Assemble specs to display
        const specs = [
          p.height_mm && ['Height', p.height_mm + ' mm'],
          p.outer_diameter_mm && ['Outer Diam.', p.outer_diameter_mm + ' mm'],
          p.gasket_od_mm && ['Gasket OD', p.gasket_od_mm + ' mm'],
          p.gasket_id_mm && ['Gasket ID', p.gasket_id_mm + ' mm'],
          p.thread_size && ['Thread Size', p.thread_size],
          p.micron_rating && ['Micron Rating', p.micron_rating + ' µm'],
          p.nominal_efficiency && ['Nominal Eff.', p.nominal_efficiency + '%']
        ].filter(Boolean);

        // Gather all cross references
        const oems = p.oem_codes || [];
        const competitors = p.competitor_codes || [];
        const allRefs = [...oems, ...competitors];

        return `
          <div class="component-card">
            <div class="card-top">
              <div class="card-title-block">
                <a href="https://part-search.elimfilters.com?q=${encodeURIComponent(sku)}" target="_blank" class="card-sku-link">${sku}</a>
                <div class="card-type-desc">${(p.description_es || p.description || p.filter_type || 'FILTRO').toUpperCase()}</div>
              </div>
              <div class="card-badges">
                ${p.filter_type ? `<span class="badge">${p.filter_type}</span>` : ''}
                ${p.sub_type ? `<span class="badge install">${p.sub_type}</span>` : ''}
                ${p.installation_type ? `<span class="badge install">${p.installation_type}</span>` : ''}
                ${p.technology ? `<span class="badge tech">${p.technology}</span>` : ''}
                <span class="badge duty">${p.duty || 'LIGHT_DUTY'}</span>
              </div>
            </div>

            ${specs.length > 0 ? `
              <div class="card-specs">
                ${specs.map(([l, v]) => `
                  <div class="spec-item">
                    <div class="spec-lbl">${l}</div>
                    <div class="spec-val">${v}</div>
                  </div>
                `).join('')}
              </div>
            ` : ''}

            ${allRefs.length > 0 ? `
              <button class="card-refs-toggle" onclick="toggleRefs(this, ${idx})">
                <span>+ VIEW CROSS-REFERENCES (${allRefs.length})</span>
              </button>
              <div class="refs-list" id="refs-${idx}">
                ${allRefs.map(ref => `
                  <div class="ref-entry">
                    <span class="ref-brand">${ref.brand || 'OEM'}:</span>
                    <span>${ref.code}</span>
                  </div>
                `).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');

      componentsHtml += '</div>';

      resultsContainer.innerHTML = headerHtml + componentsHtml;
    }

    // Toggle cross-reference dropdown view
    window.toggleRefs = function(btn, idx) {
      const list = document.getElementById(`refs-${idx}`);
      const isClosed = !list.classList.contains('open');
      list.classList.toggle('open', isClosed);
      btn.querySelector('span').innerText = isClosed 
        ? `- HIDE CROSS-REFERENCES`
        : `+ VIEW CROSS-REFERENCES (${list.querySelectorAll('.ref-entry').length})`;
    };

    async function sendMessage() {
      const text = aiInput.value.trim();
      if (!text) return;
      
      aiInput.value = '';
      
      chatWindow.innerHTML += `<div class="msg user">${text}</div>`;
      chatWindow.scrollTop = chatWindow.scrollHeight;
      
      const loadingId = 'loading-' + Date.now();
      chatWindow.innerHTML += `<div id="${loadingId}" class="msg ai"><span class="loading-dots">// ENGINEERING ANALYSIS IN PROGRESS</span></div>`;
      chatWindow.scrollTop = chatWindow.scrollHeight;

      try {
        const payload = {
          messages: [{ role: 'user', content: text }],
          context: currentContext
        };

        const res = await fetch('/api/ai/consult-v2', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const data = await res.json();
        document.getElementById(loadingId).remove();
        
        let aiHtml = marked.parse(data.answer || '// ANALYSIS FAILED');
        chatWindow.innerHTML += `<div class="msg ai">${aiHtml}<span class="ai-signature">ELIMFILTERS AI · ${data.specialist || 'SYSTEM'}</span></div>`;
        chatWindow.scrollTop = chatWindow.scrollHeight;
      } catch (err) {
        document.getElementById(loadingId).innerHTML = '// CONNECTION DROPPED';
      }
    }

    aiBtn.addEventListener('click', sendMessage);
    aiInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

    // Toggle AI drawer
    const aiToggle = document.getElementById('ai-toggle');
    const aiDrawer = document.getElementById('ai-drawer');
    aiToggle.addEventListener('click', () => {
      aiDrawer.classList.toggle('open');
      if (aiDrawer.classList.contains('open')) {
        document.getElementById('ai-input').focus();
      }
    });

    executeSearch();
  </script>
  <script src="/js/chat-widget.js"></script>
</body>
</html>
