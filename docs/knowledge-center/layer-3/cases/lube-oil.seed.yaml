    technical_family: bypass_lubrication_filtration
    product_family: bypass_lube_filters
    technology: SYNTRAX
    symptoms: [particle_count_or_soot_not_improving, no_temperature_change, no_flow_evidence]
    minimum_evidence: [plumbing_route, flow_or_orifice_check, oil_analysis_trend, element_age]
    probable_causes: [no_flow, blocked_orifice, incorrect_plumbing, saturated_element, unsuitable_expectation]
