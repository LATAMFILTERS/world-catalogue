schema_version: "1.0"
protection_system: lube_oil
status: ENGINEERING_DRAFT
production_eligible: false
cases:
  - id: OIL-FF-0001
    title: Full-flow lube filter plugs before expected interval
    technical_family: engine_lubrication_filtration
    product_family: full_flow_lube_filters
    technology: SYNTRAX
    symptoms: [high_differential_pressure, bypass_activation, short_service_life]
    minimum_evidence: [oil_hours, oil_analysis, differential_pressure, engine_condition, element_inspection]
    probable_causes: [soot_overload, coolant_ingress, oxidation_sludge, wear_debris, incorrect_filter]
    diagnostic_procedure: [verify_pressure, inspect_element, sample_oil, review combustion and cooling faults, verify application]
    stop_rules: [do_not_extend_interval_when_bypass_or_abnormal_debris_is present]
