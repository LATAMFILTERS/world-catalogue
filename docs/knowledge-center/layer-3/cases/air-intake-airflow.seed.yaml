  - id: AIR-ENG-0002
    title: Dust found on clean side of engine air system
    technical_family: engine_air_filtration
    product_family: primary_and_safety_air_filters
    technology: MACROCORE
    symptoms: [clean_side_dust, turbo_or_engine_wear_indicators]
